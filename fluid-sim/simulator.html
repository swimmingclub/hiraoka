  spawn(S,any){ const srcs=(S.els||[]).filter(e=>e.t==='src'); if(srcs.length&&Math.random()<0.35){ const e=srcs[Math.floor(Math.random()*srcs.length)], a=Math.random()*6.283; return {x:e.x+0.15*Math.cos(a),y:e.y+0.15*Math.sin(a)}; }
    if(S.P.U>0||!S.els||!S.els.length) return {x:any?-6+Math.random()*12:-6.1,y:(Math.random()*2-1)*3.7};
    return {x:-6+Math.random()*12,y:(Math.random()*2-1)*3.7}; },
  vel(S){ const U=S.P.U, els=S.els.map(e=>({...e}));
    return (x,y)=>{ let u=U, v=0;
      for(const e of els){ const dx=x-e.x, dy=y-e.y, r2=dx*dx+dy*dy;
        if(r2<(e.t==='snk'?0.012:0.0004)) return null;
        if(e.t==='src'||e.t==='snk'){ const m=(e.t==='src'?1:-1)*e.k/(2*Math.PI); u+=m*dx/r2; v+=m*dy/r2; }
        else { const G=(e.t==='vcw'?1:-1)*e.k/(2*Math.PI); u+=G*dy/r2; v+=-G*dx/r2; } }
      return [u,v]; }; },
  onPointer(S,ev){ const [x,y]=FT.toW(this.view,S.pointer.x,S.pointer.y);
    if(ev==='down'){ S.drag=S.els.find(e=>Math.hypot(e.x-x,e.y-y)*this.view.s<16)||null;
      if(!S.drag){ S.els.push({t:S.P.type,x,y,k:S.P.k}); } }
    else if(ev==='move' && S.drag){ S.drag.x=x; S.drag.y=y; }
    else if(ev==='up') S.drag=null; },
  key(S){ return JSON.stringify([S.P.U,S.els.map(e=>[e.t,e.x.toFixed(2),e.y.toFixed(2),e.k])]); },
  step(S,dt){ FT.advect(S.parts,this.view,this.vel(S),Math.max(S.P.U,3),dt,()=>this.spawn(S,false),1.5);
    if(S.P.U===0) for(const p of S.parts) if(Math.random()<0.003) Object.assign(p,this.spawn(S,true)); },
  stag(S){ // よどみ点をニュートン法で探す（格子から出発）
    const vel=this.vel(S), out=[];
    for(let gx=-5.5;gx<=5.5;gx+=0.5) for(let gy=-3.5;gy<=3.5;gy+=0.5){ let x=gx,y=gy, ok=false;
      for(let it=0;it<30;it++){ const V=vel(x,y); if(!V) break; const h=1e-4, Vx=vel(x+h,y), Vy=vel(x,y+h); if(!Vx||!Vy) break;
        const a=(Vx[0]-V[0])/h, b=(Vy[0]-V[0])/h, c=(Vx[1]-V[1])/h, d=(Vy[1]-V[1])/h, det=a*d-b*c; if(Math.abs(det)<1e-12) break;
        const dx=(d*V[0]-b*V[1])/det, dy=(-c*V[0]+a*V[1])/det; x-=dx; y-=dy; if(Math.hypot(dx,dy)<1e-7){ok=true;break;} }
      if(ok && Math.abs(x)<6 && Math.abs(y)<3.8 && !out.some(p=>Math.hypot(p[0]-x,p[1]-y)<0.05)) out.push([x,y]); }
    return out; },
  draw(g,S){
    const C=S.C, v=this.view, vel=this.vel(S), key=this.key(S);
    if(S.P.heat && S.P.U>0) FT.heat(g,S.cache,key,v,vel,S.P.U,{lo:-3,hi:1});
    if(S.lk!==key){ S.lk=key; S.lines=[]; S.st=this.stag(S);
      if(S.P.U>0) for(let i=-12;i<=12;i++) S.lines.push(FT.trace(v,vel,-6.2,i*0.3+0.001,0.04,600));
      for(const e of S.els){ if(e.t==='src') for(let j=0;j<16;j++){ const a=2*Math.PI*(j+0.5)/16; S.lines.push(FT.trace(v,vel,e.x+0.12*Math.cos(a),e.y+0.12*Math.sin(a),0.04,600)); }
        if(e.t[0]==='v') for(let j=1;j<=5;j++) S.lines.push(FT.trace(v,vel,e.x+0.25*j,e.y,0.03,500)); }
      S.sep=S.st.map(p=>FT.trace(v,vel,p[0]-0.02,p[1]+0.001,0.03,900).concat([])); }
    for(const L of S.lines) line(g,L,C.ink,1);
    for(const st of S.st){ for(const dd of [[0.03,0.03],[0.03,-0.03],[-0.03,0.03],[-0.03,-0.03]]) line(g,FT.trace(v,vel,st[0]+dd[0],st[1]+dd[1],0.03,900),C.hi,2.2); }
    FT.drawParts(g,S.parts,v,C.water_deep);
    for(const e of S.els){ const [X,Y]=FT.toS(v,e.x,e.y);
      g.fillStyle=e.t==='src'?C.hi:(e.t==='snk'?C.lo:C.m); g.beginPath(); g.arc(X,Y,9,0,7); g.fill();
      text(g,e.t==='src'?'+':(e.t==='snk'?'−':(e.t==='vcw'?'↻':'↺')),X,Y,{align:'center',size:13,weight:700,color:C.paper}); }
    for(const st of S.st){ const [X,Y]=FT.toS(v,st[0],st[1]); g.fillStyle=C.paper; g.strokeStyle=C.ink; g.lineWidth=2; g.beginPath(); g.arc(X,Y,6,0,7); g.fill(); g.stroke(); }
    if(S.P.U>0){ arrow(g,24,30,104,30,C.ink,3,10); text(g,'U = '+S.P.U+' m/s',112,30,{size:14,weight:700}); }
    // 目盛り
    for(let m=-5;m<=5;m++){ const [X]=FT.toS(v,m,0); line(g,[[X,H-8],[X,H]],C.muted,1); }
    text(g,'目盛り 1 m',W-12,H-20,{align:'right',size:11,color:C.muted});
  },
  readout(S){ const rows=[['要素の数',String(S.els.length)]];
    const st=(S.st||[]).slice(0,3).map(p=>'('+fmt(p[0])+', '+fmt(p[1])+')').join(' ');
    rows.push(['よどみ点 [m]',st||'なし']);
    const one=S.els.length===1&&S.els[0].t==='src'&&S.P.U>0;
    if(one){ const m=S.els[0].k; rows.push(['理論 $x_s = -m/(2\\pi U)$',fmt(-m/(2*Math.PI*S.P.U))+' m'],['下流での物体の幅 $m/U$',fmt(m/S.P.U)+' m'],['物体表面の流線 $\\psi$',fmt(m/2)+' m²/s']); }
    return rows; }
});

// 中級：ポンプと管路（システム曲線と運転点）
defineSim({
  id:'pumpline', level:'intermediate', order:8, name:'ポンプと管路（揚程と動力）',
  formula:'$$H_{\\text{sys}}(Q) = \\Delta z + \\left(f\\frac{L}{d} + \\sum K\\right)\\frac{v^2}{2g} \\qquad P = \\frac{\\rho g Q H}{\\eta}$$',
  explain:'**ポンプは水を $\\Delta z$ だけ持ち上げるのに加え、管路の摩擦と曲がりなどの損失のぶんもヘッドを与えなければなりません**。管路に必要なヘッドを流量に対して描いたのが「システム曲線」で、損失は $Q^2$ に比例するので放物線になります。ポンプの性能曲線との交点が実際の運転点です。',
  hint:'==流量を 2 倍にすると、損失ヘッドと軸動力はどう変わるでしょう？== 「ポンプ曲線を表示」をオンにすると、ポンプがどの流量で運転されるか（運転点）が分かります。「M8 の条件」で問題の状態になります。',
  related:['M8'],
  params:[
    {id:'Q',label:'流量 $Q$',min:0.002,max:0.05,step:0.001,value:0.02,unit:'m³/s',digits:3},
    {id:'dz',label:'実揚程 $\\Delta z$',min:0,max:40,step:1,value:20,unit:'m'},
    {id:'L',label:'管の長さ $L$',min:10,max:500,step:10,value:100,unit:'m'},
    {id:'d',label:'内径 $d$',min:5,max:30,step:1,value:10,unit:'cm'},
    {id:'K',label:'局所損失係数の合計 $\\sum K$',min:0,max:10,step:0.5,value:1.5,digits:1},
    {id:'eta',label:'ポンプ効率 $\\eta$',min:0.4,max:0.9,step:0.01,value:0.75,digits:2},
    {id:'pc',label:'ポンプ曲線を表示（締切揚程 45 m）',type:'check',value:true},
  ],
  buttons:[{label:'M8 の条件',action:S=>{ setParam('Q',0.02); setParam('dz',20); setParam('L',100); setParam('d',10); setParam('K',1.5); setParam('eta',0.75); }}],
  f:0.02,
  sys(S,Q){ const A=Math.PI/4*(S.P.d/100)**2, v=Q/A, hv=v*v/19.62; return {v,hv,hf:this.f*S.P.L/(S.P.d/100)*hv,hm:S.P.K*hv,H:S.P.dz+(this.f*S.P.L/(S.P.d/100)+S.P.K)*hv}; },
  pump(Q){ return 45-30000*Q*Q; },
  calc(S){ const s=this.sys(S,S.P.Q), Pw=1000*9.81*S.P.Q*s.H; return {...s,Pw,P:Pw/S.P.eta}; },
  op(S){ let lo=0, hi=0.08; for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(this.sys(S,m).H<this.pump(m)) lo=m; else hi=m; } return lo; },
  init(S){ S.parts=Array.from({length:60},()=>({s:Math.random()})); },
  step(S,dt){ const v=this.calc(S).v; for(const p of S.parts){ p.s+=v*dt*0.05; if(p.s>1)p.s-=1; } },
  draw(g,S){
    const C=S.C, r=this.calc(S);
    // 左：模式図
    const yl=520, yu=yl-clamp(S.P.dz,0,40)*9-40;
    const tank=(x,y,w)=>{ g.save(); g.fillStyle=C.water; g.globalAlpha=.75; g.fillRect(x,y,w,50); g.restore(); line(g,[[x,y-20],[x,y+50],[x+w,y+50],[x+w,y-20]],C.ink,2.5); };
    tank(30,yl,110); tank(280,yu,110);
    const pth=[[140,yl+35],[200,yl+35],[200,yu+35],[280,yu+35]];
    line(g,pth,C.ink,8); line(g,pth,C.water,4);
    g.fillStyle=C.accent; g.beginPath(); g.arc(200,yl-10,22,0,7); g.fill(); text(g,'P',200,yl-10,{align:'center',size:15,weight:700,color:C.paper});
    let L=0; for(let i=1;i<pth.length;i++) L+=Math.hypot(pth[i][0]-pth[i-1][0],pth[i][1]-pth[i-1][1]);
    g.fillStyle=C.paper; for(const p of S.parts){ let d=p.s*L; for(let i=1;i<pth.length;i++){ const sl=Math.hypot(pth[i][0]-pth[i-1][0],pth[i][1]-pth[i-1][1]); if(d<=sl){ const t=d/sl; g.beginPath(); g.arc(lerp(pth[i-1][0],pth[i][0],t),lerp(pth[i-1][1],pth[i][1],t),2.2,0,7); g.fill(); break; } d-=sl; } }
    arrow(g,470,yl,470,yu,C.m,1.5,8); arrow(g,470,yu,470,yl,C.m,1.5,8); text(g,'Δz = '+fmt(S.P.dz)+' m',462,(yl+yu)/2,{align:'right',size:14,weight:700,color:C.m,bg:C.paper});
    // ヘッドの内訳（積み上げ棒）
    const bx=30, by=40, bh=24, sc=360/Math.max(60,r.H);
    [[S.P.dz,C.m,'実揚程'],[r.hf,C.hi,'摩擦'],[r.hm,C.a,'局所']].reduce((x,[v,col,lb])=>{ g.fillStyle=col; g.fillRect(x,by,v*sc,bh); if(v*sc>40) text(g,lb,x+v*sc/2,by+bh/2,{align:'center',size:12,weight:700,color:C.paper}); return x+v*sc; },bx);
    text(g,'H_p = '+fmt(r.H)+' m',bx,by+bh+18,{size:15,weight:700});
    text(g,'= 実揚程 '+fmt(S.P.dz)+' + 摩擦 '+fmt(r.hf)+' + 局所 '+fmt(r.hm),bx,by+bh+42,{size:13});
    [[C.m,'実揚程'],[C.hi,'摩擦損失'],[C.a,'局所損失']].forEach(([c,l],i)=>{ g.fillStyle=c; g.fillRect(bx+i*110,by+bh+60,12,12); text(g,l,bx+i*110+18,by+bh+66,{size:12}); });
    // 右：システム曲線
    const gx=520, gy=60, gw=410, gh=420, Qm=0.06, Hm=60;
    const PX=q=>gx+q/Qm*gw, PY=h=>gy+gh-clamp(h,0,Hm)/Hm*gh;
    rect(g,gx,gy,gw,gh,null,C.line,1);
    for(let q=0;q<=Qm+1e-9;q+=0.01){ line(g,[[PX(q),gy+gh],[PX(q),gy+gh+5]],C.muted,1); text(g,fmt(q,2),PX(q),gy+gh+16,{align:'center',size:11,mono:true,color:C.muted}); }
    for(let h=0;h<=Hm;h+=10){ line(g,[[gx-5,PY(h)],[gx,PY(h)]],C.muted,1); text(g,String(h),gx-8,PY(h),{align:'right',size:11,mono:true,color:C.muted}); }
    text(g,'流量 Q [m³/s]',gx+gw/2,gy+gh+34,{align:'center',size:12,color:C.muted}); text(g,'揚程 H [m]',gx,gy-14,{size:12,color:C.muted});
    const pts=[]; for(let i=0;i<=120;i++){ const q=Qm*i/120, h=this.sys(S,q).H; if(h>Hm) break; pts.push([PX(q),PY(h)]); } line(g,pts,C.accent,2.5);
    text(g,'システム曲線',pts.length?pts[pts.length-1][0]-6:gx,pts.length?pts[pts.length-1][1]+16:gy,{align:'right',size:13,weight:700,color:C.accent});    line(g,[[gx,PY(S.P.dz)],[gx+gw,PY(S.P.dz)]],C.m,1,[4,4]);
    g.fillStyle=C.hi; g.beginPath(); g.arc(PX(S.P.Q),PY(r.H),7,0,7); g.fill();
    text(g,'('+fmt(S.P.Q,2)+', '+fmt(r.H)+' m)',PX(S.P.Q)+10,PY(r.H)+16,{size:13,weight:700,color:C.hi,bg:C.paper});
    if(S.P.pc){ const pp=[]; for(let i=0;i<=60;i++){ const q=Qm*i/60; if(this.pump(q)>0) pp.push([PX(q),PY(this.pump(q))]); } line(g,pp,C.b,2.5);
      const qo=this.op(S); g.strokeStyle=C.b; g.lineWidth=3; g.beginPath(); g.arc(PX(qo),PY(this.pump(qo)),9,0,7); g.stroke();
      text(g,'運転点 Q = '+fmt(qo,3)+' m³/s',PX(qo)+12,PY(this.pump(qo))-16,{size:13,weight:700,color:C.b,bg:C.paper}); }
  },
  readout(S){ const r=this.calc(S); return [
    ['流速 $v$',fmt(r.v)+' m/s'],['摩擦損失 $h_f$（$f = 0.02$）',fmt(r.hf)+' m'],['局所損失 $\\sum K\\, v^2/2g$',fmt(r.hm)+' m'],
    ['全揚程 $H_p$',fmt(r.H)+' m'],['水動力 $\\rho g Q H_p$',fmt(r.Pw/1000)+' kW'],['軸動力 $P = \\rho g Q H_p/\\eta$',fmt(r.P/1000)+' kW']]; }
});

// 中級：レイノルズ数と層流・乱流（レイノルズの着色実験）
defineSim({
  id:'reynolds', level:'intermediate', order:2, name:'レイノルズ数と層流・乱流',
  formula:'$$Re = \\frac{\\rho v d}{\\mu} = \\frac{v d}{\\nu} \\qquad \\text{円管：}\\ Re < 2300\\ \\text{で層流、}\\ Re > 4000\\ \\text{程度で乱流}$$',
  explain:'**レイノルズの実験では、管の中心に色水を流し込みます**。流れが遅い（Re が小さい）ときは色水が 1 本の線のまま流れます（層流）。速くすると線が波打ち、やがてちぎれて管全体に混ざります（乱流）。Re は「慣性力 ÷ 粘性力」で、粘性が流れの乱れを抑えきれるかどうかを表します。',
  hint:'水で流速 0.1 m/s → 0.5 m/s と上げて、色の線の変化を見ましょう。同じ速さでも油（粘性が大きい）なら層流のままです。右側の速度分布は、層流では放物線、乱流では中央が平らになります。',
  related:['M2'],
  liveReadout:true,
  params:[
    {id:'v',label:'平均流速 $v$',min:0.01,max:1,step:0.01,value:0.1,unit:'m/s'},
    {id:'d',label:'管の内径 $d$',min:0.5,max:5,step:0.1,value:2,unit:'cm'},
    {id:'nu',label:'流体',type:'select',value:'1e-6',options:[['1e-6','水 (ν = 1.0×10⁻⁶ m²/s)'],['1.5e-5','空気 (ν = 1.5×10⁻⁵ m²/s)'],['1e-4','油 (ν = 1.0×10⁻⁴ m²/s)']]},
  ],
  Re(S){ return S.P.v*(S.P.d/100)/(+S.P.nu); },
  init(S){ S.dye=[]; S.acc=0; },
  // 乱れの強さ 0（層流）〜1（乱流）
  turb(Re){ return clamp((Re-2000)/2500,0,1); },
  step(S,dt){
    const Re=this.Re(S), T=this.turb(Re), k=420; // 表示速度：最大 ~ 一定に正規化
    const vis=Math.min(1, 0.15+S.P.v*1.2);
    S.acc+=dt*120; while(S.acc>1){ S.acc-=1; S.dye.push({x:150,y:0,vy:0,ph:Math.random()*6.28}); }
    for(const p of S.dye){
      const yr=clamp(p.y,-1,1);
      const prof = T<0.5 ? (1-yr*yr)*2*(1-T*2) + (T*2)*(1.22*Math.pow(1-Math.abs(yr),1/7)) : 1.22*Math.pow(1-Math.abs(yr),1/7);
      p.x+=prof*vis*k*0.5*dt;
      if(T>0){ // 下流ほど乱れが成長
        const grow=clamp((p.x-150)/500,0,1);
        p.vy+= (Math.random()-0.5)*T*grow*60*dt + Math.sin(p.x/30+p.ph+S.t*3)*T*grow*0.6*dt*(T<0.6?4:1);
        p.vy*=0.94; p.y+=p.vy*dt*8;
        if(p.y>0.97){p.y=0.97;p.vy*=-0.5;} if(p.y<-0.97){p.y=-0.97;p.vy*=-0.5;}
      }
    }
    S.dye=S.dye.filter(p=>p.x<800);
  },
  draw(g,S){
    const C=S.C, cy=280, R=110, Re=this.Re(S), T=this.turb(Re);
    g.save(); g.fillStyle=C.water; g.globalAlpha=.18; g.fillRect(60,cy-R,740,2*R); g.restore();
    line(g,[[60,cy-R],[800,cy-R]],C.ink,3); line(g,[[60,cy+R],[800,cy+R]],C.ink,3);
    // 色水の注入針
    line(g,[[70,cy-160],[70,cy-20],[150,cy]],C.solid,4); text(g,'色水',70,cy-178,{align:'center',size:13});
    g.fillStyle=C.hi;
    for(const p of S.dye){ g.globalAlpha=T>0.6?0.35:0.9; g.beginPath(); g.arc(p.x,cy+p.y*R,T>0.6?3.5:2.4,0,7); g.fill(); }
    g.globalAlpha=1;
    // 速度分布
    const x0=830; line(g,[[x0,cy-R],[x0,cy+R]],C.muted,1);
    const pts=[]; for(let i=-20;i<=20;i++){ const y=i/20; const lam=(1-y*y)*2, tur=1.22*Math.pow(1-Math.abs(y),1/7);
      const u=T<0.5? lam*(1-T*2)+tur*T*2 : tur; pts.push([x0+u*45,cy+y*R]); if(i%4===0) arrow(g,x0,cy+y*R,x0+u*45,cy+y*R,C.accent,1.2,6); }
    line(g,pts,C.accent,2); text(g,'速度分布',x0+40,cy+R+22,{align:'center',size:13,color:C.accent});
    // Re メーター
    const mx=120, my=500, mw=640;
    const logRe=v=>clamp((Math.log10(v)-1)/(5-1),0,1);
    for(let i=0;i<mw;i+=2){ const t=i/mw, Rv=10**(1+t*4); g.fillStyle=Rv<2300?C.b:(Rv<4000?C.m:C.a); g.fillRect(mx+i,my,2,14); }
    [10,100,1000,2300,10000,100000].forEach(v=>{ const x=mx+logRe(v)*mw; line(g,[[x,my+14],[x,my+20]],C.muted,1); text(g,v>=1e5?'10⁵':String(v),x,my+32,{align:'center',size:11,mono:true,color:C.muted}); });
    const xr=mx+logRe(Re)*mw; g.fillStyle=C.ink; g.beginPath(); g.moveTo(xr,my-2); g.lineTo(xr-7,my-14); g.lineTo(xr+7,my-14); g.fill();
    const state=Re<2300?'層流':(Re<4000?'遷移域':'乱流');
    text(g,'Re = '+fmt(Re)+'　→　'+state,xr,my-30,{align:'center',size:17,weight:700,color:Re<2300?C.b:(Re<4000?C.m:C.a)});
  },
  readout(S){ const Re=this.Re(S); return [
    ['レイノルズ数 $Re = vd/\\nu$',fmt(Re)],['流れの状態',Re<2300?'層流':(Re<4000?'遷移域':'乱流')],
    ['臨界流速 $v_c$（$Re = 2300$）',fmt(2300*(+S.P.nu)/(S.P.d/100))+' m/s']]; }
});

// 初級：サイフォン
defineSim({
  id:'siphon', level:'beginner', order:8, name:'サイフォンの原理',
  formula:'$$v = \\sqrt{2gH} \\qquad p_{\\text{頂部}} = p_{\\text{atm}} - \\rho g z - \\frac{1}{2}\\rho v^2$$',
  explain:'**管を水で満たしておけば、出口が水面より低い限り、水は山を越えて流れ続けます**。流速は水面と出口の高さの差 $H$ だけで決まります。管の頂部では圧力が大気圧より下がり、__ベルヌーイの定理__で求められます。',
  hint:'==頂部の高さ $z$ を上げても流量は変わりません。では、どこまで上げられるでしょう？== !!絶対圧が水の蒸気圧（約 2.3 kPa）まで下がると、水が沸騰して流れが切れます!!。',
  related:['B8'],
  liveReadout:true,
  params:[
    {id:'H',label:'出口の深さ $H$（水面から）',min:0.2,max:5,step:0.1,value:2,unit:'m'},
    {id:'z',label:'頂部の高さ $z$（水面から）',min:0,max:10,step:0.1,value:1.5,unit:'m'},
    {id:'d',label:'管の内径 $d$',min:0.5,max:5,step:0.1,value:2,unit:'cm'},
  ],
  calc(S){ const g=9.81, v=Math.sqrt(2*g*S.P.H), pt=-1000*g*S.P.z-0.5*1000*v*v, pabs=101300+pt, zmax=(101300-2300)/(1000*g)-S.P.H;
    return {v,Q:Math.PI/4*(S.P.d/100)**2*v,pt,pabs,zmax,cav:pabs<2300}; },
  init(S){ S.parts=Array.from({length:90},()=>({s:Math.random()})); S.bub=[]; },
  path(S){ // 管の折れ線（世界座標 m、水面 y=0）
    return [[1.2,-0.6],[1.2,S.P.z],[3.6,S.P.z],[3.6,-S.P.H]]; },
  step(S,dt){ const r=this.calc(S); const sp=r.cav?0:r.v*0.04;
    for(const p of S.parts){ p.s+=sp*dt; if(p.s>1) p.s-=1; }
    if(r.cav){ if(Math.random()<0.4) S.bub.push({x:1.2+Math.random()*2.4,y:S.P.z,t:0}); }
    for(const b of S.bub){ b.t+=dt; } S.bub=S.bub.filter(b=>b.t<1.2); },
  draw(g,S){
    const C=S.C, r=this.calc(S), top=Math.max(S.P.z,1)+0.6, bottom=-Math.max(S.P.H,1)-0.6, K=Math.min(500/(top-bottom),90);
    const X=x=>90+x*170, Y=y=>40+(top-y)*K;
    // タンク
    g.save(); g.fillStyle=C.water; g.globalAlpha=.7; g.fillRect(X(-0.2),Y(0),X(1.6)-X(-0.2),Y(-1.2)-Y(0)); g.restore();
    line(g,[[X(-0.2),Y(0.8)],[X(-0.2),Y(-1.2)],[X(1.6),Y(-1.2)],[X(1.6),Y(0.8)]],C.ink,3);
    text(g,'▽ 水面',X(-0.15),Y(0)-14,{size:13,color:C.accent});
    // 管（色は圧力：赤 = 大気圧より高い、青 = 低い）
    const pth=this.path(S), segs=[];
    for(let i=0;i<pth.length-1;i++){ const [x1,y1]=pth[i],[x2,y2]=pth[i+1]; for(let k=0;k<20;k++){ const t=k/20, t2=(k+1)/20;
      const y=lerp(y1,y2,(t+t2)/2), p=-1000*9.81*y-(y<-0.5&&i===0?0:0.5*1000*r.v*r.v);
      const pg=i===0&&y<0? -1000*9.81*y-0.5*1000*r.v*r.v : -1000*9.81*y-0.5*1000*r.v*r.v;
      g.strokeStyle=heat(0.5+clamp(pg/60000,-0.5,0.5)); g.lineWidth=14; g.lineCap='butt';
      g.beginPath(); g.moveTo(X(lerp(x1,x2,t)),Y(lerp(y1,y2,t))); g.lineTo(X(lerp(x1,x2,t2)),Y(lerp(y1,y2,t2))); g.stroke(); } }
    line(g,pth.map(([x,y])=>[X(x),Y(y)]),C.ink,1.2);
    // 粒子
    const L=pth.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-pth[i][0],p[1]-pth[i][1]),0);
    g.fillStyle=C.paper;
    for(const p of S.parts){ let d=p.s*L; for(let i=0;i<pth.length-1;i++){ const sl=Math.hypot(pth[i+1][0]-pth[i][0],pth[i+1][1]-pth[i][1]);
      if(d<=sl){ const t=d/sl; g.beginPath(); g.arc(X(lerp(pth[i][0],pth[i+1][0],t)),Y(lerp(pth[i][1],pth[i+1][1],t)),2.5,0,7); g.fill(); break; } d-=sl; } }
    for(const b of S.bub){ g.strokeStyle=C.paper; g.lineWidth=1.5; g.beginPath(); g.arc(X(b.x),Y(b.y)-b.t*20,3+b.t*4,0,7); g.stroke(); }
    // 寸法
    arrow(g,X(4.3),Y(0),X(4.3),Y(-S.P.H),C.accent,1.5,8); text(g,'H = '+fmt(S.P.H)+' m',X(4.3)+8,Y(-S.P.H/2),{size:14,weight:700,color:C.accent});
    line(g,[[X(1.6),Y(0)],[X(4.5),Y(0)]],C.muted,1,[4,4]); line(g,[[X(3.6),Y(-S.P.H)],[X(4.5),Y(-S.P.H)]],C.muted,1,[4,4]);
    if(S.P.z>0.05){ arrow(g,X(2.4),Y(0),X(2.4),Y(S.P.z),C.m,1.5,8); text(g,'z = '+fmt(S.P.z)+' m',X(2.4)+8,Y(S.P.z/2),{size:14,weight:700,color:C.m}); }
    if(!r.cav){ arrow(g,X(3.6),Y(-S.P.H)+8,X(3.6),Y(-S.P.H)+50,C.ink,3,10); text(g,'v = '+fmt(r.v)+' m/s',X(3.6)+12,Y(-S.P.H)+36,{size:14,weight:700}); }
    text(g,'頂部の絶対圧 '+fmt(r.pabs/1000)+' kPa',X(2.4),Y(S.P.z)-26,{align:'center',size:15,weight:700,color:r.cav?C.a:C.lo,bg:C.paper});
    if(r.cav) text(g,'蒸気圧より低い：水が沸騰して流れが止まる',X(2.4),Y(S.P.z)-52,{align:'center',size:15,weight:700,color:C.a,bg:C.paper});
    text(g,'管の色：赤 = 大気圧より高い、青 = 低い',W-16,H-18,{align:'right',size:12,color:C.muted});
  },
  readout(S){ const r=this.calc(S); return [
    ['流出速度 $v = \\sqrt{2gH}$',r.cav?'0（流れが切れる）':fmt(r.v)+' m/s'],['流量 $Q$',r.cav?'0':fmt(r.Q*1000)+' L/s'],
    ['頂部のゲージ圧',fmt(r.pt/1000)+' kPa'],['頂部の絶対圧',fmt(r.pabs/1000)+' kPa'],['頂部の限界の高さ $z_{\\max}$',fmt(r.zmax)+' m']]; }
});

// 中級：ストークスの抵抗法則と終端速度
defineSim({
  id:'stokes', level:'intermediate', order:6, name:'ストークスの抵抗と終端速度',
  formula:'$$D = 3\\pi\\mu d v \\qquad v_t = \\frac{(\\rho_s - \\rho)\\, g\\, d^2}{18\\mu} \\qquad \\left(Re = \\frac{\\rho v d}{\\mu} < 1\\ \\text{で有効}\\right)$$',
  explain:'**とても遅い流れ（Re ≪ 1）では、球の抵抗は速度に比例します**。落とした粒子は加速しますが、速くなるほど抵抗が増え、重力 − 浮力 = 抵抗 となったところで一定の速度（終端速度）になります。速度は $v(t) = v_t\\left(1 - e^{-t/\\tau}\\right)$ と指数関数的に近づき、$\\tau = \\dfrac{m}{3\\pi\\mu d}$ です。',
  hint:'粒径を 10 倍にすると終端速度は 100 倍になります。粒径を大きくしすぎると Re が 1 を超え、!!ストークスの法則が使えなくなります!!（右上に警告が出ます）。',
  related:['M6'],
  params:[
    {id:'d',label:'粒子の直径 $d$',min:0.01,max:1,step:0.01,value:0.1,unit:'mm'},
    {id:'rs',label:'粒子の密度 $\\rho_s$',min:1100,max:8000,step:50,value:2650,unit:'kg/m³'},
    {id:'fl',label:'流体',type:'select',value:'0.001,1000',options:[['0.001,1000','水 (μ = 0.001, ρ = 1000)'],['1,1260','グリセリン (μ = 1.0, ρ = 1260)'],['0.1,900','油 (μ = 0.1, ρ = 900)'],['0.0000181,1.2','空気 (μ = 1.81×10⁻⁵, ρ = 1.2)']]},
  ],
  buttons:[{label:'もう一度落とす',action:S=>{S.tt=0;}}],
  liveReadout:true,
  calc(S){ const [mu,rho]=S.P.fl.split(',').map(Number), d=S.P.d/1000, rs=S.P.rs;
    const vt=(rs-rho)*9.81*d*d/(18*mu), m=rs*Math.PI/6*d**3, tau=m/(3*Math.PI*mu*d), Re=rho*vt*d/mu;
    return {mu,rho,d,rs,vt,m,tau,Re,W:m*9.81,B:rho*Math.PI/6*d**3*9.81}; },
  init(S){ S.tt=0; },
  step(S,dt){ S.tt+=dt; if(S.tt>7) S.tt=0; },
  draw(g,S){
    const C=S.C, r=this.calc(S), T=S.tt/1.2; // 1.2 秒 = τ
    const v=r.vt*(1-Math.exp(-T)), dist=T-(1-Math.exp(-T)); // 位置（v_t·τ 単位）
    // 左：液柱
    const cx=150, top=60, bot=560;
    g.save(); g.fillStyle=C.water; g.globalAlpha=.25; g.fillRect(cx-70,top,140,bot-top); g.restore();
    line(g,[[cx-70,top],[cx-70,bot],[cx+70,bot],[cx+70,top]],C.ink,2);
    const y=top+20+clamp(dist*70,0,bot-top-40);
    g.fillStyle=C.wood; g.beginPath(); g.arc(cx,y,14,0,7); g.fill(); g.strokeStyle=C.ink; g.lineWidth=1.5; g.stroke();
    const fs=60/r.W;
    arrow(g,cx-34,y,cx-34,y+r.W*fs,C.ink,3,10); text(g,'重力',cx-40,y+r.W*fs,{align:'right',size:12});
    arrow(g,cx+34,y,cx+34,y-r.B*fs,C.accent,3,10); text(g,'浮力',cx+40,y-r.B*fs,{size:12,color:C.accent});
    const D=3*Math.PI*r.mu*r.d*v; if(D*fs>2){ arrow(g,cx,y-16,cx,y-16-D*fs,C.hi,3,10); text(g,'抵抗',cx+6,y-26-D*fs,{size:12,color:C.hi}); }
    text(g,'（粒子は拡大表示）',cx,bot+20,{align:'center',size:12,color:C.muted});
    // 右：v-t グラフ
    const gx=330, gy=80, gw=580, gh=380;
    rect(g,gx,gy,gw,gh,null,C.line,1);
    for(let i=0;i<=5;i++){ const x=gx+i/5*gw; line(g,[[x,gy+gh],[x,gy+gh+6]],C.muted,1); text(g,i+'τ',x,gy+gh+20,{align:'center',size:12,mono:true,color:C.muted}); }
    text(g,'時間 t（τ = '+fmt(r.tau*1000)+' ms）',gx+gw,gy+gh+44,{align:'right',size:13,color:C.muted});
    const Yv=vv=>gy+gh-vv/r.vt*gh*0.8;
    line(g,[[gx,Yv(r.vt)],[gx+gw,Yv(r.vt)]],C.hi,1.5,[6,4]);
    text(g,'終端速度 v_t = '+fmt(r.vt*1000)+' mm/s',gx+gw-8,Yv(r.vt)-14,{align:'right',size:14,weight:700,color:C.hi});
    const pts=[]; for(let i=0;i<=100;i++){ const t=5*i/100; pts.push([gx+t/5*gw,Yv(r.vt*(1-Math.exp(-t)))]); } line(g,pts,C.muted,1.2,[3,3]);
    const pts2=[]; for(let i=0;i<=100;i++){ const t=Math.min(T,5)*i/100; pts2.push([gx+t/5*gw,Yv(r.vt*(1-Math.exp(-t)))]); } line(g,pts2,C.accent,3);
    text(g,'速度 v',gx+6,gy+14,{size:13,color:C.muted});
    // Re チェック
    const ok=r.Re<1;
    text(g,'Re = '+fmt(r.Re)+(ok?'（< 1：ストークスの法則が使える）':'（> 1：ストークスの法則の適用範囲外）'),gx,gy-34,{size:14,weight:700,color:ok?C.b:C.a});
  },
  readout(S){ const r=this.calc(S); return [
    ['終端速度 $v_t$',fmt(r.vt*1000)+' mm/s'],['レイノルズ数 $Re$',fmt(r.Re)],['時定数 $\\tau = m/(3\\pi\\mu d)$',fmt(r.tau*1000)+' ms'],
    ['重力 − 浮力',fmt(r.W-r.B)+' N'],['終端での抵抗 $3\\pi\\mu d v_t$',fmt(3*Math.PI*r.mu*r.d*r.vt)+' N']]; }
});

// 初級：トリチェリの定理
defineSim({
  id:'torricelli', level:'beginner', order:5, name:'トリチェリの定理（小孔からの流出）',
  formula:'$$v = \\sqrt{2gh} \\qquad x = v\\sqrt{\\frac{2H}{g}} = 2\\sqrt{hH}$$',
  explain:'**水面から深さ h の小孔から出る水の速さは、高さ h から物が自由落下したときの速さと同じです**。水面と孔に__ベルヌーイの定理__を当てはめると導けます。孔から出た水は__水平投射__なので、床までの到達距離も計算できます。',
  hint:'==水位を一定にして孔の高さを動かすと、到達距離が最大になるのはどこでしょう？==（答え：孔が水面と床のちょうど中間にあるとき）。「水位が下がる」をオンにすると、流出がだんだん弱まる様子が見られます。',
  related:['B5'],
  liveReadout:true,
  params:[
    {id:'L',label:'床からの水位 $L$',min:0.5,max:3,step:0.05,value:2.6,unit:'m'},
    {id:'H',label:'孔の高さ $H$（床から）',min:0,max:3,step:0.05,value:0.8,unit:'m'},
    {id:'d',label:'孔の直径 $d$',min:0.5,max:5,step:0.1,value:2,unit:'cm'},
    {id:'drain',label:'水位が下がる（タンク直径 0.5 m）',type:'check',value:false},
  ],
  K:150, floor:560, xt:260,
  init(S){ S.level=S.P.L; S.drops=[]; S.acc=0; },
  onParam(S,id){ if(id==='L'||id==='drain') S.level=S.P.L; },
  h(S){ return Math.max(0,S.level-S.P.H); },
  step(S,dt){
    const h=this.h(S), v=Math.sqrt(2*9.81*h);
    if(S.P.drain && h>0){ const a=Math.PI/4*(S.P.d/100)**2, A=Math.PI/4*0.25; S.level-=a/A*v*dt*8; } // 8 倍速
    S.acc+=dt; while(S.acc>0.012 && h>0.001){ S.acc-=0.012; S.drops.push({x:0,y:S.P.H,vx:v,vy:0,j:Math.random()}); }
    if(h<=0.001) S.acc=0;
    for(const p of S.drops){ p.vy-=9.81*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
    S.drops=S.drops.filter(p=>p.y>0 && p.x<4.6);
  },
  draw(g,S){
    const C=S.C, K=this.K, F=this.floor, xt=this.xt, h=this.h(S), v=Math.sqrt(2*9.81*h);
    // 床と目盛り
    line(g,[[40,F],[920,F]],C.ink,2);
    for(let m=0;m<=4;m++){ const x=xt+m*K; line(g,[[x,F],[x,F+8]],C.muted,1); text(g,m+' m',x,F+20,{align:'center',size:12,color:C.muted,mono:true}); }
    // タンク
    const x0=80, top=F-3.1*K;
    g.save(); g.fillStyle=C.water; g.globalAlpha=.75; g.fillRect(x0,F-S.level*K,xt-x0,S.level*K); g.restore();
    line(g,[[x0,top],[x0,F],[xt,F],[xt,top]],C.ink,3);
    text(g,'▽',xt-20,F-S.level*K-12,{size:13,color:C.accent});
    // 孔
    const yh=F-S.P.H*K; g.fillStyle=C.paper; g.fillRect(xt-2,yh-4,5,8);
    // 深さ h の寸法
    if(h>0){ arrow(g,x0+30,F-S.level*K,x0+30,yh,C.hi,1.5,8); arrow(g,x0+30,yh,x0+30,F-S.level*K,C.hi,1.5,8);
      text(g,'h = '+fmt(h)+' m',x0+40,(F-S.level*K+yh)/2,{size:14,weight:700,color:C.hi}); }
    line(g,[[xt-40,yh],[xt+4,yh]],C.muted,1,[3,3]);
    text(g,'H = '+fmt(S.P.H)+' m',xt+10,yh+(S.P.H<0.3?-16:16),{size:13,color:C.muted});
    // 理論の放物線
    if(h>0 && S.P.H>0){ const pts=[]; const T=Math.sqrt(2*S.P.H/9.81);
      for(let i=0;i<=40;i++){ const t=T*i/40; pts.push([xt+v*t*K, F-(S.P.H-4.905*t*t)*K]); }
      line(g,pts,C.accent,1.2,[5,5]);
      const X=v*T; line(g,[[xt+X*K,F-10],[xt+X*K,F+10]],C.accent,3);
      text(g,'x = '+fmt(X)+' m',xt+X*K,F-24,{align:'center',size:15,weight:700,color:C.accent,bg:C.paper}); }
    // 水滴
    g.fillStyle=C.water_deep;
    for(const p of S.drops){ g.beginPath(); g.arc(xt+p.x*K, F-p.y*K, 2.5+p.j, 0, 7); g.fill(); }
    // 流速矢印
    if(h>0){ arrow(g,xt+8,yh-26,xt+8+v*12,yh-26,C.ink,2.5,10); text(g,'v = '+fmt(v)+' m/s',xt+12,yh-46,{size:14,weight:700}); }
    if(S.P.H>S.P.L) text(g,'孔が水面より上にあるので水は出ません',480,120,{align:'center',size:15,color:C.hi});
  },
  readout(S){ const h=this.h(S), v=Math.sqrt(2*9.81*h), a=Math.PI/4*(S.P.d/100)**2, X=2*Math.sqrt(h*S.P.H);
    const Hbest=S.level/2, Xbest=S.level;
    return [['深さ $h$',fmt(h)+' m'],['流出速度 $v = \\sqrt{2gh}$',fmt(v)+' m/s'],['流量 $Q = av$',fmt(a*v*1000)+' L/s'],
      ['到達距離 $x = 2\\sqrt{hH}$',fmt(X)+' m'],['最大になる孔の高さ',fmt(Hbest)+' m（x = '+fmt(Xbest)+' m）']]; }
});

// 初級：ベルヌーイの定理（ベンチュリ管・ピトー管）
defineSim({
  id:'venturi', level:'beginner', order:6, name:'ベルヌーイの定理（ベンチュリ管・ピトー管）',
  formula:'$$\\frac{p}{\\rho g} + \\frac{v^2}{2g} + z = \\text{一定（全ヘッド）} \\qquad p_1 - p_2 = \\frac{1}{2}\\rho\\,(v_2^2 - v_1^2)$$',
  explain:'**流線に沿って「圧力ヘッド + 速度ヘッド + 位置ヘッド」の合計は一定です**。管がしぼられた「のど部」では__連続の式__により流れが速くなり、そのぶん圧力が下がります。細い管（マノメータ）の水柱の高さが圧力ヘッドを表します。流れに向けたピトー管の水柱は全ヘッドまで上がります。',
  hint:'のど部を細くするほど水柱の差が大きくなります。点線（全ヘッド）と各水柱の差が、その場所の速度ヘッド $v^2/2g$ です。のど部の圧力が負になると、実際の管では!!キャビテーション（気泡の発生）が起こります!!。',
  related:['B6'],
  params:[
    {id:'v1',label:'入口の流速 $v_1$',min:0.2,max:3,step:0.01,value:1.41,unit:'m/s'},
    {id:'d1',label:'入口の内径 $d_1$',min:6,max:16,step:0.5,value:10,unit:'cm'},
    {id:'d2',label:'のど部の内径 $d_2$',min:2,max:16,step:0.5,value:5,unit:'cm'},
    {id:'h1',label:'入口の圧力ヘッド $p_1/\\rho g$',min:0.5,max:2.4,step:0.05,value:2,unit:'m'},
  ],
  init(S){ S.parts=Array.from({length:220},()=>({x:40+Math.random()*880,e:Math.random()*2-1})); },
  R(S,x){ const sc=4, r1=S.P.d1*sc, r2=S.P.d2*sc; // 半径 px（1 cm 直径 = 8 px）
    if(x<330) return r1; if(x>630) return r1;
    if(x<430){const t=(x-330)/100,s=t*t*(3-2*t);return lerp(r1,r2,s);} if(x<530) return r2;
    const t=(x-530)/100,s=t*t*(3-2*t); return lerp(r2,r1,s); },
  v(S,x){ return S.P.v1*(this.R(S,0)/this.R(S,x))**2; },
  step(S,dt){ for(const p of S.parts){ p.x+=this.v(S,p.x)*40*dt; if(p.x>920){p.x=40;p.e=Math.random()*2-1;} } },
  calc(S){ const g=9.81, v1=S.P.v1, v2=v1*(S.P.d1/S.P.d2)**2, hv1=v1*v1/2/g, hv2=v2*v2/2/g, H0=S.P.h1+hv1, h2=H0-hv2;
    return {v1,v2,hv1,hv2,H0,h2,dp:(S.P.h1-h2)*1000*g,Q:Math.PI/4*(S.P.d1/100)**2*v1}; },
  draw(g,S){
    const C=S.C, cy=470, K=150, r=this.calc(S);
    const top=[],bot=[]; for(let x=40;x<=920;x+=5){top.push([x,cy-this.R(S,x)]);bot.push([x,cy+this.R(S,x)]);}
    g.save(); g.fillStyle=C.water; g.globalAlpha=.25; g.beginPath(); top.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p)); bot.slice().reverse().forEach(p=>g.lineTo(...p)); g.fill(); g.restore();
    g.fillStyle=C.water_deep; for(const p of S.parts){ g.beginPath(); g.arc(p.x,cy+p.e*this.R(S,p.x)*0.9,2.4,0,7); g.fill(); }
    // 全ヘッドの線（基準は管の中心）
    const yH=cy-r.H0*K; line(g,[[40,yH],[920,yH]],C.hi,1.5,[6,5]); text(g,'全ヘッド（エネルギー線）',250,yH-14,{size:13,color:C.hi});
    // マノメータ（静圧）
    const tube=(x,head,label,col)=>{ const ytop=cy-this.R(S,x); const yw=cy-head*K;
      g.save(); g.fillStyle=col; g.globalAlpha=.7; g.fillRect(x-7,Math.min(yw,ytop),14,Math.max(0,ytop-yw)); g.restore();
      line(g,[[x-8,ytop],[x-8,yH-30]],C.ink,1.5); line(g,[[x+8,ytop],[x+8,yH-30]],C.ink,1.5);
      text(g,label,x,yH-46,{align:'center',size:13,weight:700}); };
    tube(180,S.P.h1,'① 入口',C.water); tube(480,Math.max(r.h2,0),'② のど部',C.water);
    // 差の寸法
    const y1=cy-S.P.h1*K, y2=cy-r.h2*K;
    line(g,[[180,y1],[520,y1]],C.muted,1,[3,3]);
    if(r.h2>0){ arrow(g,505,y1,505,y2,C.accent,1.5,8); text(g,'Δh = '+fmt(S.P.h1-r.h2)+' m',512,(y1+y2)/2,{size:14,weight:700,color:C.accent}); }
    else text(g,'のど部が負圧（キャビテーションの危険）',480,cy-this.R(S,480)-24,{align:'center',size:14,weight:700,color:C.hi,bg:C.paper});
    // ピトー管（出口側、流れに向いた L 字管）
    const xp=790, ytp=cy-this.R(S,xp);
    line(g,[[xp-60,cy],[xp-8,cy],[xp-8,yH-30]],C.ink,2); line(g,[[xp-60,cy+8],[xp+8,cy+8],[xp+8,yH-30]],C.ink,2);
    g.save(); g.fillStyle=C.m; g.globalAlpha=.6; g.fillRect(xp-7,yH,14,cy-yH); g.restore();
    text(g,'③ ピトー管',xp,yH-46,{align:'center',size:13,weight:700});
    tube(870,S.P.h1,'',C.water);
    arrow(g,880,y1,880,yH,C.m,1.5,8); text(g,'v²/2g',886,(y1+yH)/2,{size:13,color:C.m});
    text(g,'v₁ = '+fmt(r.v1)+' m/s',180,cy+this.R(S,180)+24,{align:'center',size:14,weight:700,color:C.accent});
    text(g,'v₂ = '+fmt(r.v2)+' m/s',480,cy+this.R(S,480)+24,{align:'center',size:14,weight:700,color:C.accent});
  },
  readout(S){ const r=this.calc(S); return [
    ['のど部の流速 $v_2$',fmt(r.v2)+' m/s'],['流量 $Q$',fmt(r.Q*1000)+' L/s'],
    ['圧力差 $p_1 - p_2$',fmt(r.dp/1000)+' kPa'],['水柱の差 $\\Delta h$',fmt(S.P.h1-r.h2)+' m'],
    ['ピトー管の水柱差 $v_1^2/2g$',fmt(r.hv1*100)+' cm'],['全ヘッド $H$',fmt(r.H0)+' m']]; }
});

SIMS.sort((a,b)=>['beginner', 'intermediate', 'advanced'].indexOf(a.level)-['beginner', 'intermediate', 'advanced'].indexOf(b.level)||(a.order||0)-(b.order||0));
boot();

</script>

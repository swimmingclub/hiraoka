<title>流体力学シミュレータ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 左に定理一覧（級ごと）、右にキャンバス＋スライダー＋計算値。狭い画面では縦積み */
:root{
  --bg:#f3f6f7; --paper:#ffffff; --ink:#14232b; --muted:#5a6d77; --line:#d4dee2;
  --accent:#0b6e8a; --accent-soft:#dceff4; --b:#2f8f5b; --m:#c07a12; --a:#b23a48; --code:#eef3f5; --hl:#ffd75e99;
  --water:#3d9fc4; --water-deep:#1c5f7f; --solid:#8a9aa2; --wood:#c89b5e; --air:#e8f1f4; --hi:#e0524f; --lo:#3c6fd8;
  --f-display:"Murecho","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --paper:#152229; --ink:#e3edf1; --muted:#93a8b2; --line:#26363e;
  --accent:#5cc2dc; --accent-soft:#16343f; --b:#5fcf8f; --m:#f0b04d; --a:#ef7d8a; --code:#1b2b33; --hl:#b0892680;
  --water:#2f87ab; --water-deep:#174e68; --solid:#5f717a; --wood:#a97f48; --air:#13232b; --hi:#ff7a6e; --lo:#6f9cff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --paper:#152229; --ink:#e3edf1; --muted:#93a8b2; --line:#26363e;
  --accent:#5cc2dc; --accent-soft:#16343f; --b:#5fcf8f; --m:#f0b04d; --a:#ef7d8a; --code:#1b2b33; --hl:#b0892680;
  --water:#2f87ab; --water-deep:#174e68; --solid:#5f717a; --wood:#a97f48; --air:#13232b; --hi:#ff7a6e; --lo:#6f9cff; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.7}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
aside{border-right:1px solid var(--line);padding:20px 12px 20px max(16px,env(safe-area-inset-left,0px));background:var(--paper);overflow-y:auto}
aside h1{font-family:var(--f-display);font-weight:800;font-size:19px;margin:0 0 2px 6px;line-height:1.3}
aside .sub{font-size:12px;color:var(--muted);margin:0 0 14px 6px}
aside a.back{font-size:12px;color:var(--accent);margin-left:6px}
.grp{margin-top:14px}
.grp h2{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0 0 4px 6px;display:flex;gap:6px;align-items:center}
.grp h2 .dot{width:8px;height:8px;border-radius:50%}
.grp a{display:block;text-decoration:none;color:var(--ink);padding:5px 8px;border-radius:6px;font-size:13.5px;line-height:1.45}
.grp a:hover{background:var(--code)}
.grp a[aria-current="page"]{background:var(--ink);color:var(--paper)}
main{padding-block:20px 40px;padding-left:24px;padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:14px;max-width:1100px}
.title{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.title h2{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,26px);margin:0;text-wrap:balance}
.lvl{font-size:12px;font-weight:700;color:var(--paper);border-radius:4px;padding:1px 8px}
.formula{font-size:16px;background:var(--code);padding:6px 16px;border-radius:8px;max-width:100%;box-sizing:border-box;overflow-x:auto;align-self:flex-start;min-width:0}

.em-b{font-weight:700;color:var(--ink)}
.em-u{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px;color:var(--ink)}
mark.em-hl{background:linear-gradient(transparent 52%,var(--hl) 52%);color:var(--ink);padding:0 1px}
.em-warn{font-weight:700;color:var(--a)}
.mjx-i svg{display:inline-block;overflow:visible}
@media (max-width:600px){.mjx-i{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding-block:2px}}
.mjx-d{display:flex;flex-wrap:wrap;align-items:center;column-gap:2.2em;row-gap:6px;padding-block:4px;max-width:100%}
.mjx-p{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden}
.mjx-p svg{display:block;overflow:visible}

.explain{margin:0;color:var(--muted);max-width:75ch}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.canvasbox{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/10;touch-action:none}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-family:var(--f-display)}
.ctl{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.ctl .lab{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.ctl .lab output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl select{font:inherit;padding:3px 6px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;margin-bottom:6px;cursor:pointer}
table.ro{width:100%;border-collapse:collapse;font-size:13px}
table.ro td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ro td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;padding-left:8px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.btn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
.related{font-size:13px;color:var(--muted)}
.related a{color:var(--accent);font-weight:700}
.hint{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{border-right:none;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  aside{padding-block:12px}
  aside .sub{display:none}
  #nav{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;margin-top:8px}
  .grp{display:flex;gap:4px;align-items:center;flex-shrink:0;margin-top:0}
  .grp h2{margin:0 2px 0 0}
  .grp a{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px))}
}
</style>

    <h1>流体力学シミュレータ</h1>

  </main>
</div>

// 数式（$…$, $$…$$）を SVG に置き換え、残りの文に強調記法を適用する
//   **太字**  __下線__  ==マーカー==  !!注意（赤）!!
function M(s){ const esc=t=>t.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const keep=[]; const re=/\$\$([\s\S]+?)\$\$|\$(?!\{)([^$\n]+?)\$/g;
  let t=s.replace(re,(all,d,i)=>{ let h;
    if(d!==undefined){ const v=MATH['D:'+d]; h=v?'<span class="mjx-d">'+v+'</span>':esc(d); }
    else { const v=MATH[i]; h=v?'<span class="mjx-i">'+v+'</span>':esc(i); }
    keep.push(h); return '\u0000'+(keep.length-1)+'\u0000'; });
  t=esc(t)
    .replace(/\*\*([\s\S]+?)\*\*/g,'<strong class="em-b">$1</strong>')
    .replace(/__([\s\S]+?)__/g,'<span class="em-u">$1</span>')
    .replace(/==([\s\S]+?)==/g,'<mark class="em-hl">$1</mark>')
    .replace(/!!([\s\S]+?)!!/g,'<strong class="em-warn">$1</strong>');
  return t.replace(/\u0000(\d+)\u0000/g,(a,n)=>keep[+n]); }
// ===== シミュレータ共通基盤 =====
// 各シミュレータは defineSim({...}) で登録する。
//  id, level('beginner'|'intermediate'|'advanced'), name, formula, explain, hint, related:['B1',...]
//  params:[{id,label,min,max,step,value,unit} | {id,label,type:'check',value} | {id,label,type:'select',options:[[v,label]],value}]
//  buttons:[{label, action(S)}]
//  init(S)          : 状態の初期化（シミュ切替時・リセット時）
//  onParam(S,id)    : パラメータ変更時（省略可）

const SIMS = [];
function defineSim(def){ SIMS.push(def); }
const LEVELS = {beginner:{label:'初級',color:'--b'},intermediate:{label:'中級',color:'--m'},advanced:{label:'上級',color:'--a'}};

// ---- 小さな道具 ----
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
function fmt(v, sig=3){
  if(!isFinite(v)) return '—';
  if(v===0) return '0';
  const a=Math.abs(v);
  if(a>=1e5||a<1e-3){ const e=Math.floor(Math.log10(a)); const m=v/10**e; return m.toFixed(sig-1)+'×10'+sup(e); }
  const d=Math.max(0,sig-1-Math.floor(Math.log10(a)));
  return v.toFixed(Math.min(d,6));
}
function sup(n){return String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹⁻'['0123456789-'.indexOf(c)]).join('')}
function arrow(g,x1,y1,x2,y2,color,w=2,head=10){
  const ang=Math.atan2(y2-y1,x2-x1), len=Math.hypot(x2-x1,y2-y1);
  if(len<1) return;
  const h=Math.min(head,len*0.6);
  g.save(); g.strokeStyle=color; g.fillStyle=color; g.lineWidth=w; g.lineCap='round';
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2-Math.cos(ang)*h*0.7,y2-Math.sin(ang)*h*0.7); g.stroke();
  g.beginPath(); g.moveTo(x2,y2);
  g.lineTo(x2-h*Math.cos(ang-0.4),y2-h*Math.sin(ang-0.4));
  g.lineTo(x2-h*Math.cos(ang+0.4),y2-h*Math.sin(ang+0.4)); g.closePath(); g.fill(); g.restore();
}
// 「h_P」「u_{max}」のような下付き文字を小さく下げて描く
function text(g,s,x,y,o={}){
  const size=(o.size||15)*1.2, font=w=>`${o.weight||500} ${w}px ${o.mono?S.C.fmono:S.C.fbody}`;
  const parts=[]; let last=0; const re=/_\{([^}]*)\}|_([^\s=,:：（）()\/+−·]+)/g; let m;
  while((m=re.exec(s))){ if(m.index>last) parts.push([s.slice(last,m.index),0]); parts.push([m[1]??m[2],1]); last=re.lastIndex; }
  if(last<s.length) parts.push([s.slice(last),0]);
  g.save(); g.textBaseline=o.base||'middle'; g.textAlign='left';
  const widths=parts.map(([t,sub])=>{ g.font=font(sub?size*0.72:size); return g.measureText(t).width; });
  const tw=widths.reduce((a,b)=>a+b,0);
  let bx=x; if((o.align||'left')==='center') bx-=tw/2; else if(o.align==='right') bx-=tw;
  if(o.bg){ const pw=6, h=size+6; g.fillStyle=o.bg; g.fillRect(bx-pw,y-h/2,tw+pw*2,h); }
  g.fillStyle=o.color||S.C.ink;
  parts.forEach(([t,sub],i)=>{ g.font=font(sub?size*0.72:size); g.fillText(t,bx,sub?y+size*0.28:y); bx+=widths[i]; });
  g.restore();
}
function line(g,pts,color,w=1.5,dash){
  g.save(); g.strokeStyle=color; g.lineWidth=w; if(dash) g.setLineDash(dash);
  g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke(); g.restore();
}
function rect(g,x,y,w,h,fill,stroke,lw=1.5){ g.save(); if(fill){g.fillStyle=fill;g.fillRect(x,y,w,h);} if(stroke){g.strokeStyle=stroke;g.lineWidth=lw;g.strokeRect(x,y,w,h);} g.restore(); }
// 圧力などのカラーマップ（低=青 → 高=赤）、t∈[0,1]
function heat(t){ t=clamp(t,0,1);
  const s=[[60,111,216],[110,190,220],[240,240,230],[245,170,90],[224,82,79]];
  const k=t*(s.length-1), i=Math.min(Math.floor(k),s.length-2), f=k-i;
  const c=s[i].map((v,j)=>Math.round(lerp(v,s[i+1][j],f))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
// 粒子（流れの可視化用）
function makeParticles(n,spawn){ return Array.from({length:n},()=>spawn(true)); }

const S = {P:{}, t:0, C:{}, pointer:{x:0,y:0,down:false}};

const cv=document.getElementById('cv'), g=cv.getContext('2d');

    .forEach(k=>S.C[k.replace('-','_')]=cs.getPropertyValue('--'+k).trim());
  S.C.fbody=cs.getPropertyValue('--f-body'); S.C.fmono=cs.getPropertyValue('--f-mono');
}
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2), r=cv.getBoundingClientRect();
  const scale=(r.width||W)/W*dpr;
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
  g.setTransform(scale,0,0,scale,0,0);
}
function buildNav(){

  const bl=document.getElementById('backlink');

function buildControls(sim){
  const box=document.getElementById('ctls'); box.innerHTML='';
  S.P={};
  (sim.params||[]).forEach(p=>{
    S.P[p.id]=p.value;

      l.querySelector('input').onchange=e=>{S.P[p.id]=e.target.checked; changed(p.id)}; box.appendChild(l); return;
    }
    const d=document.createElement('div'); d.className='ctl';
    if(p.type==='select'){
      d.innerHTML=`<div class="lab"><label for="${id}">${M(p.label)}</label></div><select id="${id}">${p.options.map(([v,l])=>`<option value="${v}" ${v==p.value?'selected':''}>${l}</option>`).join('')}</select>`;
      d.querySelector('select').onchange=e=>{S.P[p.id]=e.target.value; changed(p.id)};
    } else {

      const out=d.querySelector('output');

function show(p,v){ const d=p.digits??Math.max(0,-Math.floor(Math.log10(p.step||1))); return (+v).toFixed(d)+(p.unit?' '+p.unit:''); }
function changed(id){ if(cur.onParam) cur.onParam(S,id); updateReadout(); }
function setParam(id,v){ S.P[id]=v; const el=document.getElementById('p-'+cur.id+'-'+id); if(el){ if(el.type==='checkbox') el.checked=v; else el.value=v; el.dispatchEvent(new Event('input')); } }
let roKey='';
function updateReadout(){
  const rows=cur.readout?cur.readout(S):[], tb=document.getElementById('ro'), key=cur.id+'|'+rows.map(r=>r[0]).join('|');
  if(key!==roKey){ roKey=key; tb.innerHTML=rows.map(([a,b])=>`<tr><td>${M(a)}</td><td></td></tr>`).join(''); }
  rows.forEach(([a,b],i)=>{ const c=tb.rows[i]&&tb.rows[i].cells[1]; if(c&&c.textContent!==b) c.textContent=b; });
}
function select(id,force){
  const sim=SIMS.find(s=>s.id===id)||SIMS[0];

  cur=sim;
  document.querySelectorAll('#nav a').forEach(a=>{ if(a.dataset.id===sim.id){ a.setAttribute('aria-current','page'); try{a.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){} } else a.removeAttribute('aria-current'); });
  const L=LEVELS[sim.level];
  const lv=document.getElementById('lvl'); lv.textContent=L.label; lv.style.background=`var(${L.color})`;
  document.getElementById('simname').textContent=sim.name;

  document.title=sim.name+' | 流体力学シミュレータ';
  for(const k of Object.keys(S)) if(!['P','C','pointer'].includes(k)) delete S[k];

function route(){ select(location.hash.slice(1)); }
function pos(e){ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]; }
cv.addEventListener('pointerdown',e=>{[S.pointer.x,S.pointer.y]=pos(e); S.pointer.down=true; cv.setPointerCapture(e.pointerId); cur.onPointer&&cur.onPointer(S,'down'); updateReadout();});
cv.addEventListener('pointermove',e=>{[S.pointer.x,S.pointer.y]=pos(e); if(S.pointer.down&&cur.onPointer){cur.onPointer(S,'move'); updateReadout();}});
cv.addEventListener('pointerup',()=>{S.pointer.down=false; cur.onPointer&&cur.onPointer(S,'up');});
let last=performance.now(), roTimer=0;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05); last=now; S.t+=dt;
  if(cur.step){ cur.step(S,dt); roTimer+=dt; if(roTimer>0.25&&cur.liveReadout){roTimer=0; updateReadout();} }
  g.save(); g.fillStyle=S.C.paper; g.fillRect(0,0,W,H); cur.draw(g,S); g.restore();
  requestAnimationFrame(frame);
}
function boot(){

// ===== 2 次元の流れ場を描く道具（上級のポテンシャル流で共用） =====
// view = {cx, cy, s}：世界座標 (x, y) → 画面 (cx + x·s, cy − y·s)
// vel(x, y) → [u, v]、内部(物体の中)なら null
const FT = {
  toS(v,x,y){ return [v.cx+x*v.s, v.cy-y*v.s]; },
  toW(v,X,Y){ return [(X-v.cx)/v.s, (v.cy-Y)/v.s]; },
  // 圧力係数 Cp = 1 − |V|²/U² の色地図（オフスクリーンに描いてキャッシュ）
  heat(g, cache, key, view, vel, U, opt={}){
    if(cache.key!==key){
      const w=192, h=120, c=cache.cv||document.createElement('canvas'); c.width=w; c.height=h;
      const cx=c.getContext('2d'), img=cx.createImageData(w,h);
      for(let j=0;j<h;j++) for(let i=0;i<w;i++){
        const [x,y]=FT.toW(view,(i+0.5)/w*W,(j+0.5)/h*H), V=vel(x,y), k=(j*w+i)*4;
        if(!V){ img.data[k+3]=0; continue; }
        const cp=1-(V[0]**2+V[1]**2)/(U*U), lo=opt.lo??-3, hi=opt.hi??1, t=clamp(cp<0?0.5*(1-cp/lo):0.5+0.5*cp/hi,0,1); // Cp = 0（一様流）を中間色に
        const m=heat(t).match(/\d+/g); img.data[k]=+m[0]; img.data[k+1]=+m[1]; img.data[k+2]=+m[2]; img.data[k+3]=150;
      }
      cx.putImageData(img,0,0); cache.cv=c; cache.key=key;
    }
    g.save(); g.imageSmoothingEnabled=true; g.drawImage(cache.cv,0,0,W,H); g.restore();
  },
  // 流線を始点から前後に追跡（RK2）
  trace(view, vel, x, y, ds=0.04, n=700){
    const pts=[];
    for(const dir of [1,-1]){ let px=x, py=y; const arr=[];
      for(let i=0;i<n;i++){
        const V=vel(px,py); if(!V) break; const sp=Math.hypot(V[0],V[1]); if(sp<1e-6) break;
        const mx=px+dir*V[0]/sp*ds/2, my=py+dir*V[1]/sp*ds/2, V2=vel(mx,my); if(!V2) break;
        const s2=Math.hypot(V2[0],V2[1]); if(s2<1e-6) break;
        px+=dir*V2[0]/s2*ds; py+=dir*V2[1]/s2*ds;
        const [X,Y]=FT.toS(view,px,py); if(X<-20||X>W+20||Y<-20||Y>H+20) break;
        arr.push([X,Y]);
      }
      if(dir===1) pts.push(...arr); else pts.unshift(...arr.reverse());
    }
    return pts;
  },
  // 粒子（左端から流入、速度に比例して移動）
  advect(parts, view, vel, U, dt, spawn, k=1){
    for(const p of parts){ const V=vel(p.x,p.y);
      if(!V){ Object.assign(p,spawn()); continue; }
      const sp=Math.hypot(V[0],V[1]), f=Math.min(1, 4*U/(sp+1e-9));
      p.x+=V[0]/U*dt*k*f; p.y+=V[1]/U*dt*k*f;
      const [X,Y]=FT.toS(view,p.x,p.y); if(X>W+5||X<-5||Y<-5||Y>H+5) Object.assign(p,spawn()); }
  },
  drawParts(g,parts,view,color){ g.fillStyle=color; for(const p of parts){ const [X,Y]=FT.toS(view,p.x,p.y); g.beginPath(); g.arc(X,Y,2.2,0,7); g.fill(); } },
  legend(g,S,x,y,lo=-3,hi=1){ for(let i=0;i<160;i++){ g.fillStyle=heat(i/160); g.fillRect(x+i,y,1,10); }
    text(g,'Cp = '+lo,x,y+22,{size:11,mono:true,color:S.C.muted}); text(g,String(hi),x+160,y+22,{align:'right',size:11,mono:true,color:S.C.muted}); text(g,'0',x+80,y+22,{align:'center',size:11,mono:true,color:S.C.muted});
    text(g,'圧力：低い ← → 高い',x+80,y-10,{align:'center',size:11,color:S.C.muted}); },
};

// 初級：等加速度運動する容器の液面
defineSim({
  id:'acceltank', level:'beginner', order:9, name:'加速する容器の液面',
  formula:'$$\\tan\\theta = \\frac{a}{g} \\qquad p = \\rho g h \\ (h：\\text{その点の水深})$$',
  explain:'**容器と一緒に動く人から見ると、水には重力 $g$ に加えて、加速と逆向きの慣性力 $a$ が働きます**。水面はこの 2 つの合力に垂直な面になるので、加速すると後ろ側が高くなります。鉛直方向には加速していないので、底の圧力は各点の水深から $\\rho g h$ で求まります。',
  hint:'==ブレーキ（$a$ を負）にすると、水面はどちらに傾くでしょう？== 加速度を大きくしすぎると !!水がタンクからこぼれます!!。「B9 の条件」で問題の状態になります。',
  related:['B9'],
  params:[
    {id:'a',label:'加速度 $a$（前向き正）',min:-8,max:8,step:0.1,value:3,unit:'m/s²'},
    {id:'L',label:'タンクの長さ $L$',min:1,max:4,step:0.1,value:2,unit:'m'},
    {id:'h0',label:'静止時の水深 $h_0$',min:0.2,max:1.5,step:0.05,value:1,unit:'m'},
  ],
  buttons:[{label:'B9 の条件',action:S=>{ setParam('a',3); setParam('L',2); setParam('h0',1); }}],
  Ht:1.8,
  calc(S){ const t=S.P.a/9.81, dh=S.P.L/2*t; return {t,th:Math.atan(t)*180/Math.PI,back:S.P.h0+dh,front:S.P.h0-dh,spill:S.P.h0+Math.abs(dh)>this.Ht,dry:S.P.h0-Math.abs(dh)<0}; },
  init(S){ S.ts=0; S.x=0; S.v=0; },
  step(S,dt){ const r=this.calc(S); S.ts+=(r.t-S.ts)*Math.min(1,dt*3); S.v=clamp(S.v+S.P.a*dt*0.2,-3,3); if(Math.abs(S.P.a)<0.05) S.v*=0.98; S.x=(S.x+S.v*dt*60)%60; },
  draw(g,S){
    const C=S.C, r=this.calc(S), K=Math.min(150,560/S.P.L), cx=440, base=430, Lp=S.P.L*K, x0=cx-Lp/2, x1=cx+Lp/2, Ht=this.Ht*K;
    // 地面とトラック
    line(g,[[20,base+70],[W-20,base+70]],C.ink,2);
    g.save(); g.strokeStyle=C.muted; for(let x=-60+(-S.x%60);x<W;x+=60){ g.beginPath(); g.moveTo(x,base+70); g.lineTo(x+20,base+82); g.stroke(); } g.restore();
    rect(g,x0-30,base,Lp+60,30,C.solid,C.ink,1.5);
    rect(g,x1+30,base-90,110,120,C.solid,C.ink,1.5); text(g,'進行方向 →',x1+85,base-110,{align:'center',size:13,color:C.muted});
    for(const wx of [x0+20,x1-20,x1+100]){ g.fillStyle=C.ink; g.beginPath(); g.arc(wx,base+44,22,0,7); g.fill(); }
    // 水（水面は中央を軸に傾く。こぼれる分は切り取る）
    const t=S.ts, hb=S.P.h0+S.P.L/2*t, hf=S.P.h0-S.P.L/2*t;
    g.save(); g.beginPath(); g.rect(x0,base-Ht,Lp,Ht); g.clip();
    g.fillStyle=C.water; g.globalAlpha=.8; g.beginPath(); g.moveTo(x0,base); g.lineTo(x0,base-hb*K); g.lineTo(x1,base-hf*K); g.lineTo(x1,base); g.closePath(); g.fill(); g.restore();
    line(g,[[x0,base-Ht],[x0,base],[x1,base],[x1,base-Ht]],C.ink,3);
    line(g,[[x0,base-S.P.h0*K],[x1,base-S.P.h0*K]],C.muted,1,[5,5]); text(g,'静止時の水面',x0+6,base-S.P.h0*K+14,{size:12,color:C.muted});
    // 力の三角形
    const fx=x0+Lp/2, fy=base-S.P.h0*K-120, s=8;
    arrow(g,fx,fy,fx,fy+9.81*s,C.ink,3,10); text(g,'g',fx+8,fy+9.81*s-6,{size:14,weight:700});
    if(Math.abs(S.P.a)>0.05){ arrow(g,fx,fy+9.81*s,fx-S.P.a*s,fy+9.81*s,C.m,3,10); text(g,'慣性力 −a',fx-S.P.a*s/2,fy+9.81*s+18,{align:'center',size:13,weight:700,color:C.m}); }
    arrow(g,fx,fy,fx-S.P.a*s,fy+9.81*s,C.hi,2.5,10); text(g,'合力',fx-S.P.a*s-8,fy+9.81*s/2,{align:S.P.a>0?'right':'left',size:13,weight:700,color:C.hi});
    // 底の圧力分布
    for(let i=0;i<=8;i++){ const xx=x0+Lp*i/8, hh=clamp(lerp(hb,hf,i/8),0,this.Ht), p=1000*9.81*hh; arrow(g,xx,base+2,xx,base+2+p/1000*2.5,C.hi,1.3,6); }
    text(g,'底の圧力 ρgh',x0-34,base+60,{align:'right',size:12,color:C.hi});
    text(g,'θ = '+fmt(r.th)+'°',cx,40,{align:'center',size:18,weight:700,color:C.accent});
    if(r.spill) text(g,'水がこぼれます',cx,70,{align:'center',size:15,weight:700,color:C.a});
    if(r.dry) text(g,'底の一部が水面から出ます',cx,96,{align:'center',size:15,weight:700,color:C.a});

  readout(S){ const r=this.calc(S); return [

// 上級：平板の境界層（ブラジウスの解）
// ブラジウス方程式 f''' + ½ f f'' = 0, f(0)=f'(0)=0, f''(0)=0.33206 を数値積分して f'(η) の表を作る
const BLASIUS=(()=>{ const h=0.01, N=1000, fp=[0]; let f=0, f1=0, f2=0.33206;
  for(let i=0;i<N;i++){ // RK4
    const F=(y)=>[y[1],y[2],-0.5*y[0]*y[2]];
    const y=[f,f1,f2], k1=F(y), k2=F(y.map((v,j)=>v+h/2*k1[j])), k3=F(y.map((v,j)=>v+h/2*k2[j])), k4=F(y.map((v,j)=>v+h*k3[j]));
    [f,f1,f2]=y.map((v,j)=>v+h/6*(k1[j]+2*k2[j]+2*k3[j]+k4[j])); fp.push(f1); }
  return eta=> eta>=10?1:(eta<=0?0:fp[Math.floor(eta/h)]); })();
defineSim({
  id:'boundary', level:'advanced', order:4, name:'境界層（ブラジウスの解）',
  formula:'$$\\delta \\approx \\frac{5.0\\,x}{\\sqrt{Re_x}} \\qquad \\tau_w = \\frac{0.332\\,\\rho U^2}{\\sqrt{Re_x}} \\qquad \\overline{C_f} = \\frac{1.328}{\\sqrt{Re_L}} \\qquad Re_x = \\frac{Ux}{\\nu}$$',
  explain:'**粘性のある流体が平板に沿って流れると、板の表面では速度が 0 になり、その影響は表面近くの薄い層（境界層）に限られます**。層流境界層の厚さ $\\delta$ は $\\sqrt{x}$ に比例し、下流ほど厚くなります。$Re_x$ が約 $5 \\times 10^5$ を超えると乱流境界層に遷移し、急に厚くなります。',
  hint:'縦方向は大きく拡大して描いています。流速を上げると境界層は薄くなります（$\\delta \\propto 1/\\sqrt{U}$）。速度分布の形は場所によらず相似（$\\eta = y\\sqrt{U/\\nu x}$ で重なる）なのがブラジウス解の特徴です。',
  related:['A4'],
  params:[
    {id:'U',label:'一様流の速さ $U$',min:0.5,max:30,step:0.5,value:5,unit:'m/s'},
    {id:'L',label:'板の長さ $L$',min:0.1,max:3,step:0.05,value:1,unit:'m'},
    {id:'b',label:'板の幅 $b$',min:0.1,max:2,step:0.1,value:0.5,unit:'m'},
    {id:'fl',label:'流体',type:'select',value:'1.5e-5,1.2',options:[['1.5e-5,1.2','空気 (ν = 1.5×10⁻⁵, ρ = 1.2)'],['1e-6,1000','水 (ν = 1.0×10⁻⁶, ρ = 1000)']]},
  ],
  calc(S){ const [nu,rho]=S.P.fl.split(',').map(Number), U=S.P.U, L=S.P.L, ReL=U*L/nu, xt=5e5*nu/U;
    const delta=x=>{ const Re=U*x/nu; return Re<5e5?5*x/Math.sqrt(Re):0.37*x/Math.pow(Re,0.2); };
    const Cf=ReL<5e5?1.328/Math.sqrt(ReL):(0.074/Math.pow(ReL,0.2)-1742/ReL);
    return {nu,rho,U,L,ReL,xt,delta,Cf,D:0.5*rho*U*U*Cf*L*S.P.b,dL:delta(L)}; },
  init(S){ S.parts=Array.from({length:260},()=>({x:Math.random(),y:Math.random()})); },
  geo(S,r){ const x0=90, x1=880, yb=470, sx=(x1-x0)/r.L, dmax=Math.max(r.dL,1e-6), sy=330/dmax/1.25; return {x0,x1,yb,sx,sy,ymax:330/sy}; },
  u(r,x,y){ if(x<=0) return r.U; const Re=r.U*x/r.nu;
    if(Re<5e5) return r.U*BLASIUS(y*Math.sqrt(r.U/(r.nu*x)));
    const d=r.delta(x); return y>=d?r.U:r.U*Math.pow(y/d,1/7); },
  step(S,dt){ const r=this.calc(S), G=this.geo(S,r);
    for(const p of S.parts){ const x=p.x*r.L, y=p.y*G.ymax; p.x+=this.u(r,x,y)/r.U*dt*0.25; if(p.x>1){p.x=-0.08*Math.random();p.y=Math.random();} } },
  draw(g,S){

    g.save(); g.fillStyle=C.accent; g.globalAlpha=.12; g.beginPath(); g.moveTo(G.x0,G.yb); top.forEach(p=>g.lineTo(...p)); g.lineTo(G.x1,G.yb); g.fill(); g.restore();
    line(g,top,C.accent,2,[6,4]);

    g.fillStyle=C.water_deep; for(const p of S.parts){ g.beginPath(); g.arc(G.x0+p.x*r.L*G.sx,G.yb-p.y*G.ymax*G.sy,2.2,0,7); g.fill(); }
    // 平板

    // 速度分布
    for(const fx of [0.15,0.4,0.7,1.0]){ const x=r.L*fx, X=G.x0+x*G.sx, pts=[];
      for(let i=0;i<=40;i++){ const y=G.ymax*i/40, u=this.u(r,x,y); pts.push([X+u/r.U*70,G.yb-y*G.sy]); if(i%5===0) arrow(g,X,G.yb-y*G.sy,X+u/r.U*70,G.yb-y*G.sy,C.ink,1,5); }
      line(g,[[X,G.yb],[X,G.yb-G.ymax*G.sy]],C.muted,1); line(g,pts,C.ink,2); }
    // 遷移点

    text(g,'δ(L) = '+fmt(r.dL*1000)+' mm',G.x1-4,G.yb-r.dL*G.sy-18,{align:'right',size:15,weight:700,color:C.accent,bg:C.paper});
    arrow(g,20,200,70,200,C.ink,3,10); text(g,'U',20,180,{size:15,weight:700});
    text(g,'縦方向は ×'+fmt(G.sy/G.sx,2)+' に拡大',G.x0,G.yb+32,{size:13,color:C.muted});
    text(g,'x = 0（前縁）',G.x0,G.yb+52,{size:12,color:C.muted}); text(g,'x = L = '+fmt(r.L)+' m',G.x1,G.yb+52,{align:'right',size:12,color:C.muted});
  },
  readout(S){ const r=this.calc(S); return [
    ['後端のレイノルズ数 $Re_L$',fmt(r.ReL)],['状態',r.ReL<5e5?'全長で層流':'途中で乱流に遷移'],['後端の厚さ $\\delta(L)$',fmt(r.dL*1000)+' mm'],

defineSim({

  hint:'「M4 の条件」と「A5 の条件」のボタンで問題の設定にできます。圧力勾配を負（流れと逆向き）にすると、下の方で逆流が起こります。軸受けの潤滑で見られる現象です。',

    {id:'G',label:'圧力勾配 $-dp/dx$',min:-100000,max:100000,step:500,value:0,unit:'Pa/m',digits:0},
    {id:'mu',label:'粘性係数 μ',type:'select',value:'0.05',options:[['0.001','水 (0.001 Pa·s)'],['0.05','軽油・潤滑油 (0.05 Pa·s)'],['0.1','油 (0.1 Pa·s)'],['1','グリセリン (1.0 Pa·s)']]},
    {id:'A',label:'上板の面積 $A$',min:0.1,max:2,step:0.1,value:0.5,unit:'m²'},
  ],
  buttons:[
    {label:'M4 の条件',action:S=>{setParam('U',1);setParam('h',2);setParam('G',0);setSel('mu','0.05');setParam('A',0.5);}},
    {label:'A5 の条件',action:S=>{setParam('U',0);setParam('h',1);setParam('G',1000);setSel('mu','0.001');}},
  ],
  calc(S){ const U=S.P.U, h=S.P.h/1000, G=S.P.G, mu=+S.P.mu;
    const u=y=>U*y/h + G/(2*mu)*y*(h-y);
    const dudy=y=>U/h + G/(2*mu)*(h-2*y);
    const tauB=mu*dudy(0), tauT=mu*dudy(h), q=U*h/2+G*h**3/(12*mu);
    let umax=-1e9, umin=1e9; for(let i=0;i<=100;i++){const v=u(h*i/100); umax=Math.max(umax,v); umin=Math.min(umin,v);}
    return {U,h,G,mu,u,dudy,tauB,tauT,q,umax,umin,F:tauT*S.P.A}; },
  init(S){ S.parts=Array.from({length:180},()=>({x:Math.random()*700,y:Math.random()})); S.plate=0; },
  scale(r){ return 220/Math.max(Math.abs(r.umax),Math.abs(r.umin),1e-6); },
  step(S,dt){ const r=this.calc(S), k=this.scale(r)*0.9;
    for(const p of S.parts){ p.x+=r.u(p.y*r.h)*k*dt; if(p.x>700)p.x-=700; if(p.x<0)p.x+=700; }
    S.plate=(S.plate+r.U*k*dt)%80; },
  draw(g,S){
    const C=S.C, r=this.calc(S), y0=470, y1=140, x0=40, x1=740, Hh=y0-y1;
    g.save(); g.fillStyle=C.m; g.globalAlpha=.15; g.fillRect(x0,y1,x1-x0,Hh); g.restore();
    // 下板（固定）と上板（動く）
    rect(g,x0,y0,x1-x0,16,C.solid); text(g,'固定板',x0+8,y0+34,{size:13,color:C.muted});
    rect(g,x0,y1-16,x1-x0,16,C.solid);
    g.save(); g.strokeStyle=C.ink; g.lineWidth=1; for(let x=x0+S.plate;x<x1;x+=80){ g.beginPath(); g.moveTo(x,y1-16); g.lineTo(x+10,y1); g.stroke(); } g.restore();
    if(r.U>0){ arrow(g,x1-150,y1-34,x1-150+60,y1-34,C.ink,3,10); text(g,'U = '+fmt(r.U)+' m/s',x1-160,y1-34,{align:'right',size:14,weight:700}); }
    // 粒子
    g.fillStyle=C.water_deep; for(const p of S.parts){ g.beginPath(); g.arc(x0+p.x,y0-p.y*Hh,2.4,0,7); g.fill(); }
    // 速度分布
    const xs=790, k=this.scale(r)*0.6;
    line(g,[[xs,y1],[xs,y0]],C.muted,1.5);
    const pts=[]; for(let i=0;i<=40;i++){ const yy=r.h*i/40, u=r.u(yy), Y=y0-i/40*Hh; pts.push([xs+u*k,Y]); if(i%4===0) arrow(g,xs,Y,xs+u*k,Y,u>=0?C.accent:C.hi,1.3,7); }
    line(g,pts,C.accent,2.5);
    text(g,'速度分布 u(y)',xs,y1-30,{size:13,color:C.accent});
    // せん断応力
    text(g,'上板の τ = '+fmt(r.tauT)+' Pa',x0+8,y1+18,{size:14,weight:700,bg:C.paper});
    text(g,'下板の τ = '+fmt(r.tauB)+' Pa',x0+8,y0-18,{size:14,weight:700,bg:C.paper});
    if(r.umin<-1e-9) text(g,'逆流が起きています',(x0+x1)/2,y0-18,{align:'center',size:14,weight:700,color:C.hi,bg:C.paper});
    text(g,'h = '+fmt(S.P.h)+' mm（拡大表示）',(x0+x1)/2,560,{align:'center',size:13,color:C.muted});
  },
  readout(S){ const r=this.calc(S); return [
    ['最大流速 $u_{\\max}$',fmt(r.umax)+' m/s'],['単位幅流量 $q$',fmt(r.q)+' m²/s'],['平均流速 $q/h$',fmt(r.q/r.h)+' m/s'],
    ['上板のせん断応力 $\\tau$',fmt(r.tauT)+' Pa'],['下板のせん断応力 $\\tau_w$',fmt(r.tauB)+' Pa'],
    ['上板を動かす力 $F = \\tau A$',fmt(r.F)+' N'],['必要な動力 $FU$',fmt(r.F*r.U)+' W']]; }
});

function setSel(id,v){ S.P[id]=v; const el=document.getElementById('p-'+cur.id+'-'+id); if(el){ el.value=v; el.dispatchEvent(new Event('change')); } }

// 上級：円柱まわりのポテンシャル流（循環つき）、ダランベールのパラドックスとマグヌス効果
defineSim({
  id:'cylinder', level:'advanced', order:1, name:'円柱まわりの流れと循環（ダランベール・マグヌス）',
  formula:'$$W(z) = U\\left(z + \\frac{a^2}{z}\\right) + \\frac{i\\Gamma}{2\\pi}\\log z \\qquad u_\\theta = -2U\\sin\\theta - \\frac{\\Gamma}{2\\pi a} \\qquad C_p = 1 - \\left(\\frac{u_\\theta}{U}\\right)^2$$',
  explain:'**一様流（速さ U）の中に半径 a の円柱を置いたポテンシャル流です**。循環 Γ = 0 では圧力分布が前後・上下とも対称なので、抗力も揚力も 0 です（__ダランベールのパラドックス__）。円柱を回転させて時計回りの循環 Γ を与えると、上側が速く（圧力が低く）なり、揚力 $L^{\\prime} = \\rho U \\Gamma$ が生じます（__クッタ・ジューコフスキーの定理__、__マグヌス効果__）。',
  hint:'Γ を 0 から少しずつ増やすと、よどみ点（白丸）が下へ移動します。$\\Gamma = 4\\pi a U$ を超えると、よどみ点は円柱から離れて流れの中に浮かびます。右下の C_p グラフが前後対称なら抗力 0 です。',
  related:['A1','A2'],
  params:[
    {id:'U',label:'一様流の速さ $U$',min:1,max:30,step:0.5,value:10,unit:'m/s'},
    {id:'a',label:'円柱の半径 $a$',min:0.1,max:1,step:0.05,value:0.5,unit:'m'},
    {id:'G',label:'循環 $\\Gamma$（時計回り正）',min:-100,max:100,step:1,value:0,unit:'m²/s'},
    {id:'lines',label:'流線を表示',type:'check',value:true},
    {id:'heat',label:'圧力の色地図を表示',type:'check',value:true},
  ],
  buttons:[{label:'A2 の条件（Γ = 20）',action:S=>{setParam('U',10);setParam('a',0.5);setParam('G',20);}}],
  // 計算は無次元（長さ a、速度 U 単位）で行う
  vel(S){ const g=S.P.G/(2*Math.PI*S.P.a*S.P.U); // Γ/(2πaU)
    return (x,y)=>{ const r2=x*x+y*y; if(r2<1) return null;
      // dW/dz = 1 − 1/z² + i g / z  （u − iv）
      const zr=x/r2, zi=-y/r2;             // 1/z
      const z2r=zr*zr-zi*zi, z2i=2*zr*zi;  // 1/z²
      const wr=1-z2r + (-g*zi), wi=-z2i + g*zr;
      return [wr,-wi]; }; },
  view:{cx:430,cy:300,s:80},
  init(S){ S.cache={}; S.lineKey=''; S.parts=Array.from({length:240},()=>this.spawn(true)); },
  spawn(any){ return {x:any?-5.4+Math.random()*10.8:-5.4, y:(Math.random()*2-1)*3.6}; },
  step(S,dt){ FT.advect(S.parts,this.view,this.vel(S),1,dt,()=>this.spawn(false),1.6); },
  draw(g,S){
    const C=S.C, v=this.view, vel=this.vel(S), key=S.P.G/(S.P.a*S.P.U);
    if(S.P.heat) FT.heat(g,S.cache,key.toFixed(4),v,vel,1,{lo:-3,hi:1});
    if(S.P.lines){ if(S.lineKey!==key.toFixed(4)){ S.lineKey=key.toFixed(4); S.lines=[];
        for(let i=-14;i<=14;i++){ S.lines.push(FT.trace(v,vel,-5.6,i*0.26)); } }
      for(const L of S.lines) line(g,L,C.ink,1,null); }
    FT.drawParts(g,S.parts,v,C.water_deep);
    // 円柱
    g.fillStyle=C.solid; g.beginPath(); g.arc(v.cx,v.cy,v.s,0,7); g.fill(); g.strokeStyle=C.ink; g.lineWidth=2; g.stroke();
    // 回転の表示
    if(Math.abs(S.P.G)>0.5){ const dir=S.P.G>0?1:-1; g.save(); g.strokeStyle=C.paper; g.lineWidth=3; g.beginPath(); g.arc(v.cx,v.cy,v.s*0.6,-2.4,0.8); g.stroke();
      const a2=dir>0?0.8:-2.4, px=v.cx+Math.cos(a2)*v.s*0.6, py=v.cy+Math.sin(a2)*v.s*0.6; g.fillStyle=C.paper; g.beginPath(); g.arc(px,py,6,0,7); g.fill(); g.restore(); }
    // よどみ点
    const k=S.P.G/(4*Math.PI*S.P.a*S.P.U);
    const st=[]; if(Math.abs(k)<=1){ const th=Math.asin(-k); st.push(th, Math.PI-th); }
    else { const yy=-Math.sign(k)*(Math.abs(k)+Math.sqrt(k*k-1)); st.push(null); S.offStag=yy; }
    g.fillStyle=C.paper; g.strokeStyle=C.ink; g.lineWidth=2;
    for(const th of st){ let X,Y; if(th===null){ X=v.cx; Y=v.cy-S.offStag*v.s; } else { X=v.cx+Math.cos(th)*v.s; Y=v.cy-Math.sin(th)*v.s; }
      g.beginPath(); g.arc(X,Y,7,0,7); g.fill(); g.stroke(); }
    // 揚力
    const L=1.2*S.P.U*S.P.G;
    if(Math.abs(L)>1){ const len=clamp(Math.abs(L)/4,20,150)*Math.sign(L); arrow(g,v.cx,v.cy-v.s-6,v.cx,v.cy-v.s-6-len,C.hi,5,16);
      text(g,'揚力 L′ = '+fmt(L)+' N/m',v.cx+14,v.cy-v.s-30,{size:15,weight:700,color:C.hi,bg:C.paper}); }
    else text(g,'揚力 0・抗力 0',v.cx,v.cy-v.s-24,{align:'center',size:15,weight:700,color:C.hi,bg:C.paper});
    arrow(g,30,60,110,60,C.ink,3,10); text(g,'U = '+fmt(S.P.U)+' m/s',30,38,{size:14,weight:700});
    // 表面の Cp グラフ
    const gx=700, gy=400, gw=240, gh=170; rect(g,gx,gy,gw,gh,C.paper,C.line,1);
    const g2=S.P.G/(2*Math.PI*S.P.a*S.P.U), cpmin=1-(2+Math.abs(g2))**2, Y=cp=>gy+10+(1-cp)/(1-cpmin)*(gh-20);
    line(g,[[gx,Y(0)],[gx+gw,Y(0)]],C.line,1);
    const pts=[]; for(let i=0;i<=72;i++){ const th=Math.PI*2*i/72, ut=-2*Math.sin(th)-g2; pts.push([gx+i/72*gw,Y(1-ut*ut)]); } line(g,pts,C.accent,2);
    text(g,'表面の C_p（θ = 0 → 360°）',gx+6,gy-12,{size:12,color:C.muted});
    text(g,'0°',gx,gy+gh+12,{size:11,mono:true,color:C.muted}); text(g,'180°',gx+gw/2,gy+gh+12,{align:'center',size:11,mono:true,color:C.muted}); text(g,'360°',gx+gw,gy+gh+12,{align:'right',size:11,mono:true,color:C.muted});
    if(S.P.heat) FT.legend(g,S,20,555);
  },
  readout(S){ const U=S.P.U,a=S.P.a,G=S.P.G, k=G/(4*Math.PI*a*U);
    const st=Math.abs(k)<=1?fmt(Math.asin(-k)*180/Math.PI)+'°, '+fmt(180-Math.asin(-k)*180/Math.PI)+'°':'円柱から離れる';
    return [['表面の最大流速',fmt(Math.max(Math.abs(2*U+G/(2*Math.PI*a)),Math.abs(-2*U+G/(2*Math.PI*a))))+' m/s'],
      ['$\\Gamma = 0$ での $\\theta = 90^\\circ$ の $p - p_\\infty$',fmt(0.5*1.2*U*U*(-3))+' Pa'],['よどみ点 $\\theta_s$',st],['$\\Gamma/(4\\pi a U)$',fmt(k)],
      ['揚力 $L^{\\prime} = \\rho U \\Gamma$（空気 $\\rho = 1.2$）',fmt(1.2*U*G)+' N/m'],['抗力（ポテンシャル流）','0 N/m']]; }
});

// 中級：ダルシー・ワイスバッハの式とムーディ線図
function colebrook(Re,rel){ if(Re<2300) return 64/Re;
  let f=0.02; for(let i=0;i<30;i++){ f=1/(-2*Math.log10(rel/3.7+2.51/(Re*Math.sqrt(f))))**2; } return f; }
defineSim({
  id:'darcy', level:'intermediate', order:5, name:'管摩擦損失（ダルシー・ワイスバッハ）',
  formula:'$$h_f = f\\,\\frac{L}{d}\\,\\frac{v^2}{2g} \\qquad \\text{層流：}\\ f = \\frac{64}{Re} \\qquad \\text{乱流：}\\ \\frac{1}{\\sqrt{f}} = -2\\log_{10}\\!\\left(\\frac{\\varepsilon/d}{3.7} + \\frac{2.51}{Re\\sqrt{f}}\\right)$$',
  explain:'**管の中を流れると壁との摩擦でエネルギーが失われ、下流ほど圧力が下がります（並んだ水柱が直線的に低くなる）**。損失ヘッドは管の長さと速度ヘッド $v^2/2g$ に比例し、比例係数が管摩擦係数 $f$ です。$f$ は層流なら $64/Re$、乱流ならレイノルズ数と管壁の相対粗さ $\\varepsilon/d$ で決まり、それを図にしたものがムーディ線図です。',
  hint:'流速を 2 倍にすると損失ヘッドはほぼ 4 倍、ポンプ動力はほぼ 8 倍になります。ムーディ線図の上の点が、粗さや Re によってどの曲線に乗るかを見ましょう。M5 の問題のように f = 0.02 と与えられたときは「f を指定する」をオンにします。',
  related:['M5'],
  params:[
    {id:'v',label:'平均流速 $v$',min:0.05,max:5,step:0.05,value:2,unit:'m/s'},
    {id:'d',label:'内径 $d$',min:1,max:50,step:1,value:10,unit:'cm'},
    {id:'L',label:'管の長さ $L$',min:10,max:1000,step:10,value:200,unit:'m'},
    {id:'eps',label:'管壁の粗さ $\\varepsilon$',type:'select',value:'0.045',options:[['0.0015','引抜き管・ガラス (0.0015 mm)'],['0.045','商用鋼管 (0.045 mm)'],['0.26','鋳鉄管 (0.26 mm)'],['1.5','コンクリート管 (1.5 mm)']]},
    {id:'fix',label:'$f$ を指定する（$f = 0.02$）',type:'check',value:true},
  ],
  calc(S){ const nu=1e-6, d=S.P.d/100, v=S.P.v, Re=v*d/nu, rel=(+S.P.eps)/1000/d;
    const fc=colebrook(Re,rel), f=S.P.fix?0.02:fc, hf=f*S.P.L/d*v*v/19.62, Q=Math.PI/4*d*d*v;
    return {d,v,Re,rel,fc,f,hf,dp:1000*9.81*hf,Q,P:1000*9.81*Q*hf}; },
  draw(g,S){
    const C=S.C, r=this.calc(S);
    // 上段：管と水柱
    const x0=60, x1=900, cy=230, R=18, Hmax=150;
    g.save(); g.fillStyle=C.water; g.globalAlpha=.3; g.fillRect(x0,cy-R,x1-x0,2*R); g.restore();
    line(g,[[x0,cy-R],[x1,cy-R]],C.ink,3); line(g,[[x0,cy+R],[x1,cy+R]],C.ink,3);
    const h0=r.hf+2, sc=Math.min(Hmax/h0, 15);
    for(let i=0;i<5;i++){ const x=x0+60+i*(x1-x0-120)/4, head=h0-r.hf*i/4, top=cy-R-head*sc;
      g.save(); g.fillStyle=C.water; g.globalAlpha=.8; g.fillRect(x-5,top,10,head*sc); g.restore();
      line(g,[[x-6,cy-R],[x-6,cy-R-Hmax-20]],C.ink,1.2); line(g,[[x+6,cy-R],[x+6,cy-R-Hmax-20]],C.ink,1.2); }
    line(g,[[x0+60,cy-R-h0*sc],[x1-60,cy-R-(h0-r.hf)*sc]],C.hi,1.5,[6,4]);
    text(g,'動水勾配線（圧力が直線的に下がる）',x0+80,cy-R-Hmax-36,{size:13,color:C.hi});
    arrow(g,x1-40,cy-R-h0*sc,x1-40,cy-R-(h0-r.hf)*sc,C.accent,1.5,8);
    text(g,'h_f = '+fmt(r.hf)+' m',x1-46,cy-R-(h0-r.hf/2)*sc,{align:'right',size:14,weight:700,color:C.accent,bg:C.paper});
    text(g,'L = '+fmt(S.P.L)+' m',(x0+x1)/2,cy+R+18,{align:'center',size:13,color:C.muted});
    // 下段：ムーディ線図
    const mx=120, my=300, mw=780, mh=250;
    const X=Re=>mx+(Math.log10(Re)-3)/5*mw, Y=f=>my+mh-(Math.log10(f)-Math.log10(0.008))/(Math.log10(0.1)-Math.log10(0.008))*mh;
    rect(g,mx,my,mw,mh,null,C.line,1);
    [1e3,1e4,1e5,1e6,1e7,1e8].forEach(v=>{ line(g,[[X(v),my],[X(v),my+mh]],C.line,1); text(g,'10'+sup(Math.round(Math.log10(v))),X(v),my+mh+14,{align:'center',size:11,mono:true,color:C.muted}); });
    [0.01,0.02,0.03,0.05,0.1].forEach(v=>{ line(g,[[mx,Y(v)],[mx+mw,Y(v)]],C.line,1); text(g,String(v),mx-6,Y(v),{align:'right',size:11,mono:true,color:C.muted}); });
    text(g,'レイノルズ数 Re',mx+mw/2,my+mh+32,{align:'center',size:12,color:C.muted}); text(g,'f',mx-50,my+mh/2,{size:14,weight:700,color:C.muted});
    const lam=[]; for(let e=3;e<=Math.log10(2300);e+=0.02) lam.push([X(10**e),Y(64/10**e)]); line(g,lam,C.b,2);
    text(g,'層流 64/Re',X(1300),Y(64/1300)-14,{size:12,color:C.b});
    [[0,'滑らか'],[1e-4,'ε/d=10⁻⁴'],[1e-3,'10⁻³'],[1e-2,'10⁻²']].forEach(([rel,lb])=>{ const pts=[];
      for(let e=Math.log10(4000);e<=8;e+=0.04){ const f=colebrook(10**e,rel); pts.push([X(10**e),Y(f)]); }
      line(g,pts,C.muted,1.2); text(g,lb,mx+mw-4,Y(colebrook(1e8,rel))+(rel===0?12:-9),{align:'right',size:11,color:C.muted}); });
    const cur2=[]; for(let e=Math.log10(4000);e<=8;e+=0.04) cur2.push([X(10**e),Y(colebrook(10**e,r.rel))]); line(g,cur2,C.accent,2);
    const px=X(clamp(r.Re,1e3,1e8)), py=Y(clamp(r.f,0.008,0.1));
    g.fillStyle=C.hi; g.beginPath(); g.arc(px,py,7,0,7); g.fill();
    text(g,'Re = '+fmt(r.Re)+', f = '+fmt(r.f),px+12,py-14,{size:13,weight:700,color:C.hi,bg:C.paper});
  },
  readout(S){ const r=this.calc(S); return [
    ['レイノルズ数 $Re$',fmt(r.Re)],['相対粗さ $\\varepsilon/d$',fmt(r.rel)],['$f$（コールブルック式）',fmt(r.fc)],['使った $f$',fmt(r.f)],
    ['損失ヘッド $h_f$',fmt(r.hf)+' m'],['圧力損失 $\\Delta p$',fmt(r.dp/1000)+' kPa'],['流量 $Q$',fmt(r.Q*1000)+' L/s'],['ポンプ動力 $\\rho g Q h_f$',fmt(r.P)+' W']]; }
});

// 上級：次元解析（バッキンガムの π 定理）と相似則
defineSim({
  id:'dimensional', level:'advanced', order:6, name:'次元解析と相似則（模型実験）',
  formula:'$$F = f(\\rho, v, L, \\mu) \\;\\Rightarrow\\; \\frac{F}{\\rho v^2 L^2} = \\phi\\!\\left(\\frac{\\rho v L}{\\mu}\\right) \\qquad Re_{\\text{模型}} = Re_{\\text{実物}} \\;\\Rightarrow\\; \\pi_1\\ \\text{も等しい}$$',
  explain:'**抵抗 $F$ が密度 $\\rho$・速度 $v$・長さ $L$・粘性係数 $\\mu$ で決まるとき、変数 5 個から基本次元 3 個（M, L, T）を引いた 2 個の無次元数で関係が書けます（__π 定理__）**。模型と実物でレイノルズ数をそろえれば流れは力学的に相似になり、抵抗係数 $\\pi_1 = \\dfrac{F}{\\rho v^2 L^2}$ も等しくなります。模型で測った力から実物の力を予測できます。',
  hint:'模型の流体を空気のままにして「Re をそろえる」を押すと、模型の速さが非現実的な値（音速の半分近く）になります。水に変えると現実的な速さになります。Re がそろっていないと、!!予測は信用できません!!（赤い表示）。',
  related:['A6'],
  params:[
    {id:'Lp',label:'実物の長さ $L_p$',min:1,max:10,step:0.5,value:4,unit:'m'},
    {id:'vp',label:'実物の速さ $v_p$（空気中）',min:5,max:60,step:1,value:30,unit:'m/s'},
    {id:'n',label:'模型の縮尺 $1/n$',min:2,max:20,step:1,value:5,digits:0},
    {id:'fm',label:'模型実験の流体',type:'select',value:'water',options:[['water','水 (ν = 1.0×10⁻⁶, ρ = 1000)'],['air','空気 (ν = 1.5×10⁻⁵, ρ = 1.2)']]},
    {id:'vm',label:'模型の速さ $v_m$',min:1,max:200,step:0.5,value:10,unit:'m/s'},
    {id:'Fm',label:'模型で測った抵抗 $F_m$',min:10,max:3000,step:10,value:1300,unit:'N'},
  ],
  buttons:[{label:'Re をそろえる',action:S=>{ const r=cur.calc(S); setParam('vm',clamp(Math.round(r.vmatch*2)/2,1,200)); }},
    {label:'A6 の条件',action:S=>{ setParam('Lp',4); setParam('vp',30); setParam('n',5); setSel('fm','water'); setParam('vm',10); setParam('Fm',1300); }}],
  calc(S){ const nup=1.5e-5, rp=1.2, [num,rm]=S.P.fm==='water'?[1e-6,1000]:[1.5e-5,1.2];
    const Lm=S.P.Lp/S.P.n, Rep=S.P.vp*S.P.Lp/nup, Rem=S.P.vm*Lm/num, vmatch=S.P.vp*(S.P.Lp/Lm)*(num/nup);
    const pi1=S.P.Fm/(rm*S.P.vm**2*Lm**2), Fp=pi1*rp*S.P.vp**2*S.P.Lp**2;

  init(S){ S.pp=Array.from({length:70},()=>({x:Math.random(),y:Math.random()})); S.pm=Array.from({length:70},()=>({x:Math.random(),y:Math.random()})); },

    for(const p of S.pm){ p.x+=dt*0.08*S.P.vm/30; if(p.x>1){p.x=0;p.y=Math.random();} } },
  car(g,C,cx,cy,len){ const h=len*0.28; g.save(); g.fillStyle=C.solid; g.strokeStyle=C.ink; g.lineWidth=1.5; g.beginPath();
    g.moveTo(cx-len/2,cy); g.lineTo(cx-len/2,cy-h*0.55); g.quadraticCurveTo(cx-len*0.3,cy-h*0.6,cx-len*0.18,cy-h); g.lineTo(cx+len*0.15,cy-h);
    g.quadraticCurveTo(cx+len*0.3,cy-h*0.6,cx+len/2,cy-h*0.45); g.lineTo(cx+len/2,cy); g.closePath(); g.fill(); g.stroke();
    for(const wx of [-0.3,0.3]){ g.fillStyle=C.ink; g.beginPath(); g.arc(cx+wx*len,cy,h*0.22,0,7); g.fill(); } g.restore(); },
  draw(g,S){
    const C=S.C, r=this.calc(S), ok=Math.abs(Math.log10(r.ratio))<0.02;
    const panel=(x,label,fluidCol,parts,len,v,Re,L,fl)=>{ const w=440, h=230, y=20;
      g.save(); g.fillStyle=fluidCol; g.globalAlpha=.18; g.fillRect(x,y,w,h); g.restore(); rect(g,x,y,w,h,null,C.line,1);
      g.fillStyle=C.water_deep; for(const p of parts){ g.beginPath(); g.arc(x+p.x*w,y+15+p.y*(h-60),2,0,7); g.fill(); }
      line(g,[[x,y+h-40],[x+w,y+h-40]],C.ink,2); this.car(g,C,x+w/2,y+h-46,len);
      text(g,label,x+10,y+16,{size:15,weight:700}); text(g,fl,x+w-10,y+16,{align:'right',size:12,color:C.muted});

      text(g,'Re = '+fmt(Re),x+w-10,y+h-18,{align:'right',size:14,weight:700,color:ok?C.b:C.a}); };
    panel(20,'実物',C.air,S.pp,clamp(S.P.Lp*40,40,300),S.P.vp,r.Rep,S.P.Lp,'空気');
    panel(500,'模型（1/'+S.P.n+'）',S.P.fm==='water'?C.water:C.air,S.pm,clamp(S.P.Lp*40/S.P.n,8,300),S.P.vm,r.Rem,r.Lm,S.P.fm==='water'?'水':'空気');
    // Re の比較（対数軸）

    const mk=(Re,lab,col,dy)=>{ const x=X(clamp(Re,1e4,1e9)); g.fillStyle=col; g.beginPath(); g.arc(x,by,8,0,7); g.fill(); text(g,lab,x,by+dy,{align:'center',size:13,weight:700,color:col}); };

// 中級：急拡大の損失（ボルダ・カルノー）
defineSim({
  id:'expansion', level:'intermediate', order:7, name:'急拡大の損失（ボルダ・カルノー）',
  formula:'$$h_L = \\frac{(v_1 - v_2)^2}{2g} = \\left(1 - \\frac{A_1}{A_2}\\right)^2 \\frac{v_1^2}{2g} \\qquad \\frac{p_2 - p_1}{\\rho g} = \\frac{v_1^2 - v_2^2}{2g} - h_L$$',
  explain:'**管が急に太くなると、細い管から出た噴流が周りの遅い流れと混ざり、渦になってエネルギーが失われます**。下のグラフの赤線（全ヘッド）は拡大部で $h_L$ だけ下がります。圧力（青線）は上がりますが、損失のぶんだけ「損失なし」（点線）より上がり方が小さくなります。',
  hint:'==直径の比を大きくすると、損失係数 $K$ はどこまで大きくなるでしょう？==（太い管が非常に太いと $K \\to 1$：速度ヘッドを全部失う）。「ディフューザ」をオンにすると、ゆるやかに広げて損失を減らせます。',
  related:['M7'],
  params:[
    {id:'v1',label:'細い管の流速 $v_1$',min:0.5,max:8,step:0.1,value:4,unit:'m/s'},
    {id:'d1',label:'細い管の内径 $d_1$',min:2,max:10,step:0.5,value:5,unit:'cm'},
    {id:'d2',label:'太い管の内径 $d_2$',min:3,max:20,step:0.5,value:10,unit:'cm'},
    {id:'dif',label:'ゆるやかに広げる（ディフューザ、損失を約 1/5 に）',type:'check',value:false},
  ],
  calc(S){ const g=9.81, d2=Math.max(S.P.d2,S.P.d1), A=(S.P.d1/d2)**2, v2=S.P.v1*A, K=(1-A)**2*(S.P.dif?0.2:1), hL=K*S.P.v1**2/(2*g);
    const ideal=(S.P.v1**2-v2**2)/(2*g); return {g,d2,A,v2,K,hL,ideal,rise:ideal-hL}; },
  init(S){ S.parts=Array.from({length:240},()=>({x:Math.random(),e:Math.random()*2-1,ph:Math.random()*6.28})); },
  R(S,x){ const r=this.calc(S), r1=S.P.d1*6, r2=r.d2*6, xe=0.4; if(x<xe) return r1; if(!S.P.dif) return r2; const t=clamp((x-xe)/0.25,0,1); return lerp(r1,r2,t); },
  step(S,dt){ const r=this.calc(S); for(const p of S.parts){ const R1=S.P.d1*6, R=this.R(S,p.x), u=S.P.v1*(R1/R)**2; p.x+=u*dt*0.05; p.ph+=dt*3; if(p.x>1){p.x=0;p.e=Math.random()*2-1;} } },
  draw(g,S){
    const C=S.C, r=this.calc(S), cy=150, x0=40, x1=920, X=x=>x0+x*(x1-x0);
    const top=[],bot=[]; for(let i=0;i<=200;i++){ const x=i/200; top.push([X(x),cy-this.R(S,x)]); bot.push([X(x),cy+this.R(S,x)]); }
    if(!S.P.dif){ top.splice(80,0,[X(0.4),cy-r.d2*6]); bot.splice(80,0,[X(0.4),cy+r.d2*6]); }
    g.save(); g.fillStyle=C.water; g.globalAlpha=.22; g.beginPath(); top.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p)); bot.slice().reverse().forEach(p=>g.lineTo(...p)); g.fill(); g.restore();
    // 壁の線（急拡大では段差）
    const wall=(sgn)=>{ const pts=[[X(0),cy+sgn*S.P.d1*6],[X(0.4),cy+sgn*S.P.d1*6]];
      if(S.P.dif){ pts.push([X(0.65),cy+sgn*r.d2*6]); } else pts.push([X(0.4),cy+sgn*r.d2*6]); pts.push([X(1),cy+sgn*r.d2*6]); line(g,pts,C.ink,3); };
    wall(-1); wall(1);
    // 渦（急拡大の隅）
    if(!S.P.dif && r.d2>S.P.d1*1.2){ const h=(r.d2-S.P.d1)*6; for(const sgn of [-1,1]){ const ex=X(0.4)+h*1.4, ey=cy+sgn*(S.P.d1*6+h/2);
      g.save(); g.strokeStyle=C.hi; g.lineWidth=1.5; g.globalAlpha=.6; g.beginPath(); g.ellipse(ex,ey,h*1.2,h/2.4,0,S.t*3*sgn,S.t*3*sgn+5); g.stroke(); g.restore(); }
      text(g,'渦でエネルギーが失われる',X(0.52),cy-r.d2*6-16,{align:'center',size:13,weight:700,color:C.hi}); }
    g.fillStyle=C.water_deep; for(const p of S.parts){ const R=this.R(S,p.x); g.beginPath(); g.arc(X(p.x),cy+p.e*R*(p.x<0.4?0.9:Math.min(0.9,0.4+(p.x-0.4)*2.5)),2.2,0,7); g.fill(); }
    // ヘッドのグラフ
    const gy=300, gh=240, gx=x0, gw=x1-x0, ps1=3;
    const v1h=S.P.v1**2/(2*r.g), H1=ps1+v1h, H2=H1-r.hL, p2=H2-r.v2**2/(2*r.g), p2i=H1-r.v2**2/(2*r.g), top_=H1+0.3, bot_=Math.min(ps1,p2)-0.6;
    const Y=h=>gy+(top_-h)/(top_-bot_)*gh;
    rect(g,gx,gy,gw,gh,null,C.line,1);
    const xe=X(S.P.dif?0.65:0.4), xs=X(0.4);
    line(g,[[gx,Y(H1)],[xs,Y(H1)],[xe,Y(H2)],[gx+gw,Y(H2)]],C.hi,2.5); text(g,'全ヘッド',gx+8,Y(H1)-12,{size:13,weight:700,color:C.hi});
    line(g,[[gx,Y(ps1)],[xs,Y(ps1)],[xe,Y(p2)],[gx+gw,Y(p2)]],C.lo,2.5); text(g,'圧力ヘッド p/ρg',gx+8,Y(ps1)+14,{size:13,weight:700,color:C.lo});
    line(g,[[xe,Y(p2i)],[gx+gw,Y(p2i)]],C.lo,1.5,[6,4]); text(g,'損失なしの場合',gx+gw-8,Y(p2i)-12,{align:'right',size:12,color:C.lo});
    arrow(g,gx+gw-60,Y(H1),gx+gw-60,Y(H2),C.hi,1.5,7); text(g,'h_L = '+fmt(r.hL)+' m',gx+gw-68,(Y(H1)+Y(H2))/2,{align:'right',size:14,weight:700,color:C.hi,bg:C.paper});
    line(g,[[gx+gw-60,Y(H1)],[gx+gw,Y(H1)]],C.hi,1,[3,3]);
  },
  readout(S){ const r=this.calc(S); return [
    ['太い管の流速 $v_2$',fmt(r.v2)+' m/s'],['損失係数 $K$',fmt(r.K)],['損失ヘッド $h_L$',fmt(r.hL)+' m'],
    ['圧力上昇 $p_2 - p_1$',fmt(1000*9.81*r.rise/1000)+' kPa'],['損失なしの圧力上昇',fmt(1000*9.81*r.ideal/1000)+' kPa']]; }
});

// 初級：静水圧と平面壁の全圧力
defineSim({
  id:'hydrostatic', level:'beginner', order:1, name:'静水圧と水門の全圧力',
  formula:'$$p = \\rho g h \\qquad F = \\rho g\\, h_G A \\qquad h_P = h_G + \\frac{I_G}{h_G A}$$',
  explain:'**静止した水の圧力は深さに比例して大きくなり、壁を垂直に押します**。圧力は三角形に分布するので、合力（全圧力）は図心より深い位置（長方形なら水深の $\\frac{2}{3}$）に作用します。',
  hint:'==水深を 2 倍にすると、全圧力は何倍になるでしょう？==（答え：4 倍。圧力も面積も 2 倍になるから）。水の中をクリックすると、その深さの圧力が表示されます。',
  related:['B1'],
  params:[
    {id:'h',label:'水深 $h$',min:0.5,max:10,step:0.1,value:5,unit:'m'},
    {id:'b',label:'水門の幅 $b$',min:0.5,max:5,step:0.1,value:2,unit:'m'},
    {id:'rho',label:'液体',type:'select',value:'1000',options:[['1000','水 (1000 kg/m³)'],['1025','海水 (1025 kg/m³)'],['850','油 (850 kg/m³)'],['13600','水銀 (13600 kg/m³)']]},
  ],
  init(S){ S.probe=null; },
  onPointer(S,ev){ if(ev==='down'||S.pointer.down){ const y0=540, sc=48, surf=y0-S.P.h*sc;
      if(S.pointer.x>110&&S.pointer.x<560&&S.pointer.y>surf&&S.pointer.y<y0) S.probe=(S.pointer.y-surf)/sc; } },
  calc(S){ const rho=+S.P.rho, g=9.81, h=S.P.h, b=S.P.b;
    const A=b*h, hG=h/2, F=rho*g*hG*A, IG=b*h**3/12, hP=hG+IG/(hG*A);
    return {rho,g,h,b,A,hG,F,hP,pmax:rho*g*h}; },
  draw(g,S){
    const C=S.C, y0=540, sc=48, x0=110, xw=560, r=this.calc(S), surf=y0-r.h*sc;
    // 目盛り
    for(let d=0; d<=10; d++){ const y=y0-d*sc; line(g,[[x0-14,y],[x0-4,y]],C.muted,1); text(g,d+' m',x0-18,y,{align:'right',size:12,color:C.muted,mono:true}); }
    text(g,'底からの高さ',x0-18,y0-10*sc-22,{align:'right',size:12,color:C.muted});
    // 水
    const grd=g.createLinearGradient(0,surf,0,y0); grd.addColorStop(0,C.water); grd.addColorStop(1,C.water_deep);
    g.fillStyle=grd; g.fillRect(x0,surf,xw-x0,y0-surf);
    // 水面の波
    g.save(); g.strokeStyle=C.paper; g.globalAlpha=.6; g.beginPath();
    for(let x=x0;x<=xw;x+=4){ const y=surf+Math.sin(x/18+S.t*2)*1.5; x===x0?g.moveTo(x,y):g.lineTo(x,y);} g.stroke(); g.restore();
    text(g,'▽ 水面',x0+10,surf-14,{size:13,color:C.accent});
    // 容器
    line(g,[[x0,y0-10*sc-10],[x0,y0],[xw,y0]],C.ink,3);
    // 水門（右の壁）
    rect(g,xw,y0-r.h*sc,10,r.h*sc,C.solid);
    line(g,[[xw+10,y0-10*sc-10],[xw+10,y0]],C.ink,3);
    // 圧力分布（三角形）を壁の外側に描き、矢印は壁を押す向き
    // 三角形の横幅は底の圧力に比例（水銀などで大きくなる）
    const Lmax=clamp(r.pmax/49050*120,20,330);
    g.save(); g.fillStyle=C.hi; g.globalAlpha=.12; g.beginPath(); g.moveTo(xw+30,surf); g.lineTo(xw+30+Lmax,y0); g.lineTo(xw+30,y0); g.closePath(); g.fill(); g.restore();
    const n=12;
    for(let i=1;i<=n;i++){ const d=r.h*i/n, y=surf+d*sc, L=(d/r.h)*Lmax;
      arrow(g,xw+30+L,y,xw+14,y,C.hi,1.6,8); }
    line(g,[[xw+30,surf],[xw+30+Lmax,y0]],C.hi,1.2,[4,4]);
    text(g,'圧力分布 p = ρgh',xw+40,surf+18,{size:13,color:C.hi});
    // 全圧力の矢印（作用点）
    const yP=surf+r.hP*sc;
    arrow(g,xw+260,yP,xw+14,yP,C.accent,4,16);
    text(g,'F = '+fmt(r.F/1000)+' kN',xw+180,yP-18,{size:15,weight:700,color:C.accent,align:'center'});
    text(g,'作用点 h_P = '+fmt(r.hP)+' m',xw+180,yP+20,{size:13,color:C.accent,align:'center'});
    // 図心
    const yG=surf+r.hG*sc; line(g,[[xw-60,yG],[xw,yG]],C.ink,1,[3,3]); text(g,'図心',xw-64,yG,{align:'right',size:12,color:C.ink});
    // 探針
    if(S.probe!=null && S.probe<=r.h){ const y=surf+S.probe*sc, x=Math.min(S.pointer.x,xw-20);
      g.save(); g.fillStyle=C.paper; g.beginPath(); g.arc(x,y,6,0,7); g.fill(); g.restore();
      text(g,`深さ ${fmt(S.probe)} m：p = ${fmt(r.rho*9.81*S.probe/1000)} kPa`,x+12,y,{size:13,weight:700,bg:C.paper}); }
  },
  readout(S){ const r=this.calc(S); return [
    ['底のゲージ圧 $p = \\rho g h$', fmt(r.pmax/1000)+' kPa'],
    ['水門の面積 $A = bh$', fmt(r.A)+' m²'],
    ['図心の深さ $h_G$', fmt(r.hG)+' m'],
    ['全圧力 $F = \\rho g\\, h_G A$', fmt(r.F/1000)+' kN'],
    ['圧力中心 $h_P$', fmt(r.hP)+' m'],
    ['$h_P / h$', fmt(r.hP/r.h)],
  ]; }
});

// 上級：クッタ・ジューコフスキーの定理（ジューコフスキー翼とクッタ条件）
const Cx={ add:(a,b)=>[a[0]+b[0],a[1]+b[1]], sub:(a,b)=>[a[0]-b[0],a[1]-b[1]], mul:(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]],
  div:(a,b)=>{const d=b[0]*b[0]+b[1]*b[1]; return [(a[0]*b[0]+a[1]*b[1])/d,(a[1]*b[0]-a[0]*b[1])/d];}, abs:a=>Math.hypot(a[0],a[1]),
  exp:t=>[Math.cos(t),Math.sin(t)], sqrt:a=>{const r=Math.sqrt(Cx.abs(a)), t=Math.atan2(a[1],a[0])/2; return [r*Math.cos(t),r*Math.sin(t)];} };
defineSim({
  id:'kutta', level:'advanced', order:2, name:'クッタ・ジューコフスキーの定理（翼の揚力）',
  formula:'$$L^{\\prime} = \\rho U \\Gamma \\qquad \\text{クッタ条件：}\\ \\Gamma = 4\\pi R U \\sin(\\alpha + \\beta) \\qquad C_L \\approx 2\\pi \\sin(\\alpha + \\beta)$$',
  explain:'**円柱まわりの流れを写像 $z = \\zeta + \\dfrac{c^2}{\\zeta}$（__ジューコフスキー変換__）で変形すると翼型まわりの流れが得られます**。循環 Γ の大きさは「流れが鋭い後縁からなめらかに離れる」という条件（クッタ条件）で 1 つに決まり、揚力は $L^{\\prime} = \\rho U \\Gamma$ です。迎え角 α を大きくするほど、またキャンバー（反り）をつけるほど揚力が増えます。',
  hint:'「クッタ条件」をオフにして Γ = 0 にすると、流れが後縁を回り込む不自然な流れになり、揚力は 0 です。オンに戻すと後縁から流れがなめらかに離れ、揚力が生まれます。反りのある翼は迎え角 0° でも揚力が出ます。',
  related:['A2'],
  params:[
    {id:'al',label:'迎え角 $\\alpha$',min:-10,max:15,step:0.5,value:5,unit:'°'},
    {id:'dl',label:'反り（キャンバー）$\\delta$',min:0,max:0.15,step:0.01,value:0.06,digits:2},
    {id:'ep',label:'厚み $\\varepsilon$',min:0.02,max:0.2,step:0.01,value:0.1,digits:2},
    {id:'U',label:'流速 $U$',min:10,max:80,step:1,value:40,unit:'m/s'},
    {id:'kc',label:'クッタ条件を満たす循環にする',type:'check',value:true},
    {id:'Gm',label:'手動の循環（クッタ条件オフのとき）',min:-2,max:4,step:0.05,value:0,digits:2},
  ],
  geom(S){ const mu=[-S.P.ep,S.P.dl], R=Cx.abs(Cx.sub([1,0],mu)), beta=Math.asin(S.P.dl/R), al=S.P.al*Math.PI/180;
    const G=S.P.kc?4*Math.PI*R*Math.sin(al+beta):S.P.Gm*Math.PI;
    const le=Cx.add(Cx.sub(mu,[R,0]),Cx.div([1,0],Cx.sub(mu,[R,0]))), chord=2-le[0];
    return {mu,R,beta,al,G,chord}; },
  vel(S){ const q=this.geom(S), ea=Cx.exp(-q.al), eb=Cx.exp(q.al), R2=q.R*q.R;
    return (x,y)=>{ const z=[x,y], s=Cx.sqrt(Cx.sub(Cx.mul(z,z),[4,0]));
      let z1=Cx.mul([0.5,0],Cx.add(z,s)), z2=Cx.mul([0.5,0],Cx.sub(z,s));
      const d1=Cx.abs(Cx.sub(z1,q.mu)), d2=Cx.abs(Cx.sub(z2,q.mu)); const zeta=d1>=d2?z1:z2;
      if(Math.max(d1,d2)<=q.R*1.0005) return null;
      const w=Cx.sub(zeta,q.mu);
      let dW=Cx.sub(ea, Cx.div(Cx.mul([R2,0],eb),Cx.mul(w,w)));
      dW=Cx.add(dW, Cx.div([0,q.G/(2*Math.PI)],w));
      const dz=Cx.sub([1,0],Cx.div([1,0],Cx.mul(zeta,zeta)));
      if(Cx.abs(dz)<1e-3) return [0,0];
      const c=Cx.div(dW,dz); return [c[0],-c[1]]; }; },
  view:{cx:470,cy:300,s:150},
  init(S){ S.cache={}; S.lk=''; S.parts=Array.from({length:260},()=>this.spawn(true)); },
  spawn(any){ return {x:any?-3+Math.random()*6:-3.1, y:(Math.random()*2-1)*1.9}; },
  step(S,dt){ FT.advect(S.parts,this.view,this.vel(S),1,dt,()=>this.spawn(false),1.2); },
  draw(g,S){
    const C=S.C, v=this.view, q=this.geom(S), vel=this.vel(S);
    const key=[S.P.al,S.P.dl,S.P.ep,q.G.toFixed(3)].join();
    FT.heat(g,S.cache,key,v,vel,1,{lo:-3,hi:1});
    if(S.lk!==key){ S.lk=key; S.lines=[]; for(let i=-12;i<=12;i++) S.lines.push(FT.trace(v,vel,-3.2,i*0.16+0.02,0.02,900)); }
    for(const L of S.lines) line(g,L,C.ink,1);
    FT.drawParts(g,S.parts,v,C.water_deep);
    // 翼型
    g.fillStyle=C.solid; g.strokeStyle=C.ink; g.lineWidth=2; g.beginPath();
    for(let i=0;i<=200;i++){ const t=2*Math.PI*i/200, zeta=Cx.add(q.mu,Cx.mul([q.R,0],Cx.exp(t))), z=Cx.add(zeta,Cx.div([1,0],zeta)), [X,Y]=FT.toS(v,z[0],z[1]); i?g.lineTo(X,Y):g.moveTo(X,Y); }
    g.closePath(); g.fill(); g.stroke();
    // 流入方向
    const a=q.al; arrow(g,40,80,40+80*Math.cos(a),80-80*Math.sin(a),C.ink,3,10); text(g,'U = '+S.P.U+' m/s, α = '+S.P.al+'°',40,50,{size:14,weight:700});
    // 揚力
    const Lu=1/q.chord, Gr=q.G*S.P.U*Lu, L=1.2*S.P.U*Gr, CL=2*q.G/q.chord;
    if(Math.abs(CL)>0.01){ const len=clamp(Math.abs(CL)*90,15,170)*Math.sign(CL); arrow(g,v.cx,v.cy-30,v.cx,v.cy-30-len,C.hi,5,16);
      text(g,'揚力 L′ = '+fmt(L)+' N/m',v.cx+14,v.cy-40-len/2,{size:15,weight:700,color:C.hi,bg:C.paper}); }
    // 後縁の様子
    const te=FT.toS(v,2,0);
    text(g,S.P.kc?'後縁から流れがなめらかに離れる（クッタ条件）':'後縁で流れが回り込む（実際には起こらない）',te[0]-40,te[1]+70,{align:'center',size:13,weight:700,color:S.P.kc?C.b:C.a,bg:C.paper});
    FT.legend(g,S,20,555);
  },
  readout(S){ const q=this.geom(S), Lu=1/q.chord, Gr=q.G*S.P.U*Lu, CL=2*q.G/q.chord;
    return [['翼弦長 $c$（1 m として換算）','1 m'],['ゼロ揚力角 $-\\beta$',fmt(-q.beta*180/Math.PI)+'°'],['循環 $\\Gamma$',fmt(Gr)+' m²/s'],
      ['揚力係数 $C_L$',fmt(CL)],['揚力 $L^{\\prime} = \\rho U \\Gamma$（空気）',fmt(1.2*S.P.U*Gr)+' N/m'],['薄翼理論 $2\\pi(\\alpha + \\beta)$',fmt(2*Math.PI*(q.al+q.beta))]]; }
});

defineSim({

  formula:'$$p_A + \\rho_1 g\\, a = \\rho_2 g\\, h \\qquad (\\text{ゲージ圧})$$',
  explain:'**同じ液体でつながった同じ高さの点は同じ圧力です**。左の水銀面の高さで左右を比べると、左は「管の圧力 $p_A$ + 水柱 $a$ の重さ」、右は「大気圧 + 水銀柱 $h$ の重さ」で、この 2 つがつり合います。管の圧力が上がると水銀は右へ押しやられ、差 $h$ が大きくなります。',
  hint:'==管の圧力を 2 倍にすると、水銀柱の差 $h$ は 2 倍になるでしょうか？==（水柱 $a$ も変わるので、ちょうど 2 倍にはなりません）。「B7 の条件」で問題の状態になります。',
  related:['B7'],
  params:[
    {id:'pA',label:'管 A の圧力 $p_A$（ゲージ圧）',min:-10,max:60,step:0.1,value:23.7,unit:'kPa'},
    {id:'a0',label:'水銀面の初期の深さ $a_0$（$h = 0$ のとき）',min:0.05,max:0.5,step:0.01,value:0.2,unit:'m'},
    {id:'r2',label:'マノメータの液体',type:'select',value:'13600',options:[['13600','水銀 (13600 kg/m³)'],['1590','四塩化炭素 (1590 kg/m³)'],['3000','重い液体 (3000 kg/m³)']]},

    const h=(p+r1*g*S.P.a0)/(r2*g-r1*g/2), a=S.P.a0+h/2;

    g.fillStyle=liq; g.fillRect(xl-w/2,yL,w,bot-yL); g.fillRect(xr-w/2,yR,w,bot-yR); g.fillRect(xl-w/2,bot,xr-xl+w,w);
    // 管の線
    line(g,[[xl-w/2,yc+40],[xl-w/2,bot+w],[xr+w/2,bot+w],[xr+w/2,40]],C.ink,2.5);
    line(g,[[xl+w/2,yc-40],[xl+w/2,bot],[xr-w/2,bot],[xr-w/2,40]],C.ink,2.5);
    text(g,'大気に開放',xr,24,{align:'center',size:13,color:C.muted});
    // 同じ高さの点
    line(g,[[xl-80,yL],[xr+120,yL]],C.hi,1.5,[6,4]);
    g.fillStyle=C.hi; for(const x of [xl,xr]){ g.beginPath(); g.arc(x,yL,6,0,7); g.fill(); }
    text(g,'同じ高さ ⇒ 同じ圧力',xr+60,yL+20,{size:13,weight:700,color:C.hi});
    // 寸法
    arrow(g,xl-60,yc,xl-60,yL,C.accent,1.5,8); arrow(g,xl-60,yL,xl-60,yc,C.accent,1.5,8);
    text(g,'a = '+fmt(a)+' m',xl-68,(yc+yL)/2,{align:'right',size:14,weight:700,color:C.accent});
    if(Math.abs(h)>0.005){ arrow(g,xr+60,yL,xr+60,yR,C.m,1.5,8); arrow(g,xr+60,yR,xr+60,yL,C.m,1.5,8);
      text(g,'h = '+fmt(h)+' m',xr+70,(yL+yR)/2,{size:14,weight:700,color:C.m}); }
    // 等価な水柱
    const hx=820, hw=clamp(r.hw,0,3.05)/3;

    for(let m=0;m<=3;m++){ const yy=yc+460-m/3*440; line(g,[[hx+12,yy],[hx+20,yy]],C.muted,1); text(g,m+' m',hx+24,yy,{size:11,mono:true,color:C.muted}); }
    text(g,'同じ圧力を水柱で測ると',hx,yc-58,{align:'center',size:12,color:C.muted});
    text(g,fmt(r.hw)+' m'+(r.hw>3.05?'（はみ出す）':''),hx,yc+480,{align:'center',size:14,weight:700});
  },
  readout(S){ const r=this.calc(S); return [
    ['液柱の差 $h$',fmt(r.h)+' m'],['水柱の高さ $a$',fmt(r.a)+' m'],['右側：$\\rho_2 g h$',fmt(r.r2*r.g*r.h/1000)+' kPa'],
    ['左側の水柱：$\\rho_1 g a$',fmt(r.r1*r.g*r.a/1000)+' kPa'],['$p_A = \\rho_2 g h - \\rho_1 g a$',fmt(r.p/1000)+' kPa'],['等価な水柱 $p_A/\\rho_1 g$',fmt(r.hw)+' m']]; }
});

// 中級：運動量の法則（噴流が板に及ぼす力）
defineSim({
  id:'momentum', level:'intermediate', order:1, name:'運動量の法則（噴流と板）',
  formula:'$$F = \\rho Q_{\\text{rel}}\\,(v - u)(1 - \\cos\\beta) \\qquad Q_{\\text{rel}} = A\\,(v - u)$$',
  explain:'**検査体積（点線の枠）に入る運動量と出る運動量の差が、板が流体に及ぼす力です**。その反作用が板が受ける力 F です。噴流を β だけ曲げると、噴流方向の速度は (v−u) から (v−u)cos β に変わります。板が動いているときは、板から見た__相対速度__ v − u で考えます。',
  hint:'曲げ角 β を 90°（平板）から 180°（お椀形のバケット）にすると、力は 2 倍になります。ペルトン水車がバケットを使うのはこのためです。==板を噴流と同じ速さで動かすと、力はどうなるでしょう？==',
  related:['M1'],
  params:[
    {id:'d',label:'噴流の直径 $d$',min:1,max:10,step:0.5,value:5,unit:'cm'},
    {id:'v',label:'噴流の速度 $v$',min:2,max:40,step:0.5,value:20,unit:'m/s'},
    {id:'u',label:'板の速度 $u$（噴流と同じ向き）',min:0,max:20,step:0.5,value:0,unit:'m/s'},
    {id:'beta',label:'噴流を曲げる角度 $\\beta$',min:30,max:180,step:5,value:90,unit:'°'},
  ],
  calc(S){ const A=Math.PI/4*(S.P.d/100)**2, vr=Math.max(S.P.v-S.P.u,0), b=S.P.beta*Math.PI/180;
    const Q=A*vr, F=1000*Q*vr*(1-Math.cos(b)); return {A,vr,Q,F,b,P:F*S.P.u}; },
  init(S){ S.parts=[]; S.acc=0; S.wheel=0; },
  step(S,dt){ const r=this.calc(S), k=12; // 1 m/s = 12 px/s（板と一緒に動く座標）
    S.acc+=dt*r.vr*6; while(S.acc>1){ S.acc-=1; const y=Math.random()*2-1; S.parts.push({x:80,y,s:0,side:y<0?1:-1}); }
    const xp=560;
    for(const p of S.parts){
      if(p.s===0){ p.x+=r.vr*k*dt; if(p.x>=xp-90){p.s=1;} }
      else { p.s+=r.vr*k*dt; }
    }
    S.parts=S.parts.filter(p=>p.s<320);
    S.wheel+=S.P.u*dt*2;
  },
  draw(g,S){
    const C=S.C, r=this.calc(S), cy=300, xp=560, jr=Math.max(S.P.d*5,5);
    // ノズル
    g.fillStyle=C.solid; g.beginPath(); g.moveTo(20,cy-jr-30); g.lineTo(80,cy-jr); g.lineTo(80,cy+jr); g.lineTo(20,cy+jr+30); g.closePath(); g.fill();
    // 板（ベーン）: 曲げ角 β に応じた曲面
    const b=r.b, R=90, xs=xp-R;
    g.save(); g.strokeStyle=C.ink; g.lineWidth=8; g.lineCap='round'; g.beginPath();
    for(const sgn of [1,-1]){ // 中心から上下に曲がる面（流れの外側に 6px ずらす）
      for(let i=0;i<=24;i++){ const a=b*i/24; const pt=this.path(xp,cy,R,a,sgn); const X=pt[0], Y=pt[1]; i?g.lineTo(X,Y):g.moveTo(X,Y); } }
    g.stroke(); g.restore();
    // 台車
    rect(g,xp+20,cy-120,80,240,C.solid,C.ink,1.5);
    for(const yy of [cy-120,cy+120]){ g.save(); g.translate(xp+60,yy+ (yy<cy?-14:14)); g.rotate(S.wheel); g.strokeStyle=C.ink; g.lineWidth=2; g.beginPath(); g.arc(0,0,12,0,7); g.moveTo(-12,0); g.lineTo(12,0); g.stroke(); g.restore(); }
    // 粒子
    g.fillStyle=C.water_deep;
    for(const p of S.parts){ let x,y;
      if(p.s===0){ x=p.x; y=cy+p.y*jr; }
      else { const a=Math.min(p.s/R,b), base=this.path(xp,cy,R,a,p.side), ex=Math.max(0,p.s-R*b);
        const off=4+Math.abs(p.y)*jr*0.6; // 面から内側へ（噴流の厚み）
        x=base[0]+Math.cos(b)*ex-off*Math.sin(a); y=base[1]-p.side*Math.sin(b)*ex-p.side*off*Math.cos(a); }
      g.beginPath(); g.arc(x,y,3,0,7); g.fill(); }
    // 検査体積
    g.save(); g.strokeStyle=C.muted; g.setLineDash([6,5]); g.lineWidth=1.5; g.strokeRect(300,cy-230,310,460); g.restore();
    text(g,'検査体積',305,cy-242,{size:13,color:C.muted});
    // 力の矢印
    const L=clamp(r.F/8,10,260);
    arrow(g,xp+130,cy,xp+130+L,cy,C.hi,6,18);
    text(g,'F = '+fmt(r.F)+' N',xp+130,cy-28,{size:17,weight:700,color:C.hi});
    arrow(g,110,cy-jr-50,110+r.vr*5,cy-jr-50,C.accent,3,10);
    text(g,'相対速度 v − u = '+fmt(r.vr)+' m/s',110,cy-jr-72,{size:14,weight:700,color:C.accent});
    text(g,'β = '+S.P.beta+'°',xp-60,cy+jr+40,{align:'right',size:14,color:C.ink});
    text(g,'板と一緒に動く座標で見た流れ',480,575,{align:'center',size:13,color:C.muted});
  },
  // 曲面（円弧）上の点：始点 (xp−R, cy) で +x 向き、角度 a だけ向きを変えた位置。sgn=1 で上へ曲がる
  path(xp,cy,R,a,sgn){ return [xp-R+R*Math.sin(a), cy-sgn*R*(1-Math.cos(a))]; },
  readout(S){ const r=this.calc(S); return [
    ['噴流の断面積 $A$',fmt(r.A*1e4)+' cm²'],['板に当たる流量 $Q = A(v-u)$',fmt(r.Q*1000)+' L/s'],
    ['出口の噴流方向速度 $(v-u)\\cos\\beta$',fmt(r.vr*Math.cos(r.b))+' m/s'],['板が受ける力 $F$',fmt(r.F)+' N'],['板がされる仕事率 $Fu$',fmt(r.P)+' W']]; }
});

// 上級：ナビエ・ストークス方程式の数値解（格子ボルツマン法 D2Q9 による円柱まわりの流れ）
defineSim({
  id:'navierstokes', level:'advanced', order:5, name:'ナビエ・ストークス方程式（カルマン渦）',
  formula:'$$\\rho\\left(\\frac{\\partial \\boldsymbol{u}}{\\partial t} + (\\boldsymbol{u}\\cdot\\nabla)\\boldsymbol{u}\\right) = -\\nabla p + \\mu\\nabla^2\\boldsymbol{u} \\qquad Re = \\frac{UD}{\\nu}$$',
  explain:'**粘性流体の運動方程式（ナビエ・ストークス方程式）を数値計算で解き、円柱まわりの流れを表示しています**。左辺の慣性項（流れが速度を運ぶ効果）と右辺の粘性項の比がレイノルズ数です。Re が小さいと流れは円柱に沿って対称に流れますが、Re を上げると後ろに 1 対の渦ができ、さらに上げると渦が交互に放出される__カルマン渦列__になります。ポテンシャル流（粘性なし）では現れない現象です。',
  hint:'Re を 20 → 60 → 150 と変えて流れの変化を見ましょう。色は渦度（流れの回転）で、赤が反時計回り、青が時計回りです。キャンバスをドラッグすると壁を描けます（右クリック相当の消去はボタンで）。計算は格子ボルツマン法という手法で、ナビエ・ストークス方程式と同じ流れを再現します。',
  related:['A5'],
  liveReadout:true,
  params:[
    {id:'Re',label:'レイノルズ数 $Re$',min:5,max:200,step:1,value:120},
    {id:'show',label:'表示',type:'select',value:'curl',options:[['curl','渦度（回転）'],['speed','速さ'],['ux','x 方向の速度（逆流が青）']]},
    {id:'speed',label:'計算の速さ（1 フレームの計算ステップ）',min:2,max:30,step:1,value:14},
  ],
  buttons:[{label:'流れをリセット',action:S=>{ cur.reset(S,true); }},{label:'描いた壁を消す',action:S=>{ cur.reset(S,false); }}],
  NX:240, NY:96, D:20, u0:0.06,
  init(S){ this.reset(S,false); S.cv=document.createElement('canvas'); S.cv.width=this.NX; S.cv.height=this.NY; S.img=S.cv.getContext('2d').createImageData(this.NX,this.NY); },
  reset(S,keepWalls){
    const NX=this.NX, NY=this.NY, N=NX*NY;
    const walls=keepWalls&&S.bar?S.bar:new Uint8Array(N);
    if(!keepWalls){ const cx=60, cy=NY/2, r=this.D/2; for(let y=0;y<NY;y++) for(let x=0;x<NX;x++) if((x-cx)**2+(y-cy)**2<=r*r) walls[x+y*NX]=1; }
    S.bar=walls;
    S.f=Array.from({length:9},()=>new Float64Array(N)); S.rho=new Float64Array(N); S.ux=new Float64Array(N); S.uy=new Float64Array(N);
    for(let i=0;i<N;i++){ const y=Math.floor(i/NX); this.eq(S,i,1,this.u0,0.002*Math.sin(y/NY*Math.PI*2)); }
    S.probe=[]; S.steps=0;
  },
  w:[4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36], ex:[0,1,0,-1,0,1,-1,-1,1], ey:[0,0,1,0,-1,1,1,-1,-1], opp:[0,3,4,1,2,7,8,5,6],
  eq(S,i,rho,ux,uy){ const u2=ux*ux+uy*uy;
    for(let k=0;k<9;k++){ const eu=this.ex[k]*ux+this.ey[k]*uy; S.f[k][i]=this.w[k]*rho*(1+3*eu+4.5*eu*eu-1.5*u2); }
    S.rho[i]=rho; S.ux[i]=ux; S.uy[i]=uy; },
  lbm(S){
    const NX=this.NX, NY=this.NY, N=NX*NY, f=S.f, w=this.w, ex=this.ex, ey=this.ey;
    const nu=this.u0*this.D/S.P.Re, omega=1/(3*nu+0.5);
    // 衝突
    for(let i=0;i<N;i++){ if(S.bar[i]) continue;
      let r=0,u=0,v=0; for(let k=0;k<9;k++){ const fk=f[k][i]; r+=fk; u+=fk*ex[k]; v+=fk*ey[k]; }
      u/=r; v/=r; S.rho[i]=r; S.ux[i]=u; S.uy[i]=v; const u2=u*u+v*v;
      for(let k=0;k<9;k++){ const eu=ex[k]*u+ey[k]*v, feq=w[k]*r*(1+3*eu+4.5*eu*eu-1.5*u2); f[k][i]+=omega*(feq-f[k][i]); } }
    // 流れ（移流）：方向ごとにずらす
    for(let k=1;k<9;k++){ const a=f[k], dx=ex[k], dy=ey[k];
      const ys=dy>0?NY-1:0, ye=dy>0?0:NY-1, sy=dy>0?-1:1, xs=dx>0?NX-1:0, xe=dx>0?0:NX-1, sx=dx>0?-1:1;
      for(let y=ys; dy>0?y>=ye:y<=ye; y+=sy){ const yy=y-dy; if(yy<0||yy>=NY) continue;
        for(let x=xs; dx>0?x>=xe:x<=xe; x+=sx){ const xx=x-dx; if(xx<0||xx>=NX) continue; a[x+y*NX]=a[xx+yy*NX]; } } }
    // 壁での跳ね返り（すべりなし条件）
    for(let i=0;i<N;i++){ if(!S.bar[i]) continue; const x=i%NX, y=(i/NX)|0;
      for(let k=1;k<9;k++){ const xn=x+ex[k], yn=y+ey[k]; if(xn<0||xn>=NX||yn<0||yn>=NY) continue; const j=xn+yn*NX; if(S.bar[j]) continue;
        f[k][j]=f[this.opp[k]][i]; }
    }
    // 入口・上下：一様流、出口：勾配ゼロ
    for(let y=0;y<NY;y++){ this.eq(S,y*NX,1,this.u0,0); const i=NX-1+y*NX, j=NX-2+y*NX; for(let k=0;k<9;k++) f[k][i]=f[k][j]; }
    for(let x=0;x<NX;x++){ this.eq(S,x,1,this.u0,0); this.eq(S,x+(NY-1)*NX,1,this.u0,0); }
    S.steps++;
    const pi=(60+4*this.D)+Math.floor(NY/2)*NX; S.probe.push(S.uy[pi]); if(S.probe.length>4000) S.probe.shift();
  },
  step(S,dt){ for(let i=0;i<S.P.speed;i++) this.lbm(S);
    // 発散したらリセット
    if(!isFinite(S.ux[NX_half(this)])) this.reset(S,true); },
  onPointer(S,ev){ if(ev==='up') return; const sc=W/this.NX, x=Math.floor(S.pointer.x/sc), y=this.NY-1-Math.floor(S.pointer.y/sc);
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const X=x+dx, Y=y+dy; if(X>2&&X<this.NX-2&&Y>0&&Y<this.NY-1){ const i=X+Y*this.NX; S.bar[i]=1; } } },
  draw(g,S){
    const C=S.C, NX=this.NX, NY=this.NY, d=S.img.data, mode=S.P.show, u0=this.u0;
    for(let y=0;y<NY;y++) for(let x=0;x<NX;x++){ const i=x+y*NX, k=4*(x+(NY-1-y)*NX);
      if(S.bar[i]){ d[k]=90; d[k+1]=100; d[k+2]=108; d[k+3]=255; continue; }
      let t;
      if(mode==='curl'){ const xm=Math.max(x-1,0), xp=Math.min(x+1,NX-1), ym=Math.max(y-1,0), yp=Math.min(y+1,NY-1);
        const c=(S.uy[xp+y*NX]-S.uy[xm+y*NX])-(S.ux[x+yp*NX]-S.ux[x+ym*NX]); t=0.5+clamp(c/u0*2.2,-0.5,0.5); }
      else if(mode==='speed'){ t=clamp(Math.hypot(S.ux[i],S.uy[i])/(u0*1.8),0,1); }
      else { t=clamp(0.5+S.ux[i]/(u0*2.4),0,1); }
      const m=heatRGB(t); d[k]=m[0]; d[k+1]=m[1]; d[k+2]=m[2]; d[k+3]=255; }
    S.cv.getContext('2d').putImageData(S.img,0,0);
    const sc=W/NX, hh=NY*sc;
    g.save(); g.imageSmoothingEnabled=true; g.drawImage(S.cv,0,0,W,hh); g.restore();
    // プローブ位置
    const px=(60+4*this.D+0.5)*sc, py=hh-(Math.floor(NY/2)+0.5)*sc; g.strokeStyle=C.ink; g.lineWidth=1.5; g.beginPath(); g.arc(px,py,5,0,7); g.stroke();
    // 下部の説明
    const y0=hh+14, Re=S.P.Re, reg=Re<5?'付着流（はく離なし）':(Re<47?'円柱の後ろに 1 対の双子渦（定常）':'カルマン渦列（渦が交互に放出）');
    text(g,'Re = '+Re+'：'+reg,16,y0+12,{size:16,weight:700});
    // プローブの時系列
    const gx=16, gy=y0+50, gw=600, gh=120; rect(g,gx,gy,gw,gh,null,C.line,1);
    const pr=S.probe.slice(-4000); const pts=pr.map((v,i)=>[gx+i/4000*gw, gy+gh/2-v/u0*gh*0.9]); line(g,pts,C.accent,1.5);
    text(g,'円柱の下流 4D の点での横方向速度 v(t)',gx+4,gy-10,{size:12,color:C.muted});
    const st=this.strouhal(S); text(g,st?'ストローハル数 St = fD/U ≈ '+fmt(st,2):'（渦の放出なし／計測中）',gx+gw+20,gy+20,{size:15,weight:700,color:C.accent});
    text(g,'参考：実験では Re = 100〜200 で St ≈ 0.16〜0.20',gx+gw+20,gy+48,{size:12,color:C.muted});
    // 色の凡例
    const lx=gx+gw+20, ly=gy+80; for(let i=0;i<160;i++){ g.fillStyle=heat(i/160); g.fillRect(lx+i,ly,1,10); }
    const lab=mode==='curl'?['時計回り','反時計回り']:(mode==='speed'?['遅い','速い']:['逆流','順流']);
    text(g,lab[0],lx,ly+22,{size:11,color:C.muted}); text(g,lab[1],lx+160,ly+22,{align:'right',size:11,color:C.muted});
  },
  strouhal(S){ const p=S.probe; if(p.length<1500) return null; const cr=[];
    for(let i=1;i<p.length;i++) if(p[i-1]<0&&p[i]>=0) cr.push(i);
    const amp=Math.max(...p.slice(-800).map(Math.abs)); if(cr.length<3||amp<this.u0*0.02) return null;
    const T=(cr[cr.length-1]-cr[1])/(cr.length-2); return this.D/(T*this.u0); },
  readout(S){ const nu=this.u0*this.D/S.P.Re, st=this.strouhal(S); return [
    ['レイノルズ数 $Re = UD/\\nu$',String(S.P.Re)],['格子の動粘性係数 $\\nu$',fmt(nu)],['緩和時間 $\\tau = 3\\nu + \\frac{1}{2}$',fmt(3*nu+0.5)],
    ['ストローハル数 $St$',st?fmt(st,2):'—'],['計算ステップ数',String(S.steps)]]; }
});
function NX_half(o){ return Math.floor(o.NX/2)+Math.floor(o.NY/2)*o.NX; }
const HEAT_LUT=Array.from({length:256},(_,i)=>heat(i/255).match(/\d+/g).map(Number));
function heatRGB(t){ return HEAT_LUT[Math.round(clamp(t,0,1)*255)]; }

// 初級：パスカルの原理（油圧ジャッキ）
defineSim({

  hint:'==大ピストンの直径を 2 倍にすると、持ち上げる力は何倍になるでしょう？== 小ピストンを押し込んで、大ピストンがどれだけ上がるかも見てみましょう。',

    {id:'x1',label:'小ピストンの押し込み量 $x_1$',min:0,max:20,step:0.5,value:10,unit:'cm'},
  ],
  calc(S){ const P=S.P, A1=Math.PI/4*(P.d1/100)**2, A2=Math.PI/4*(P.d2/100)**2, p=P.F1/A1;
    return {A1,A2,p,F2:p*A2,ratio:A2/A1,x2:P.x1*A1/A2,W1:P.F1*P.x1/100}; },

    rect(g,xL-w1/2,yP1-16,w1,16,C.solid,C.ink,1.5);
    rect(g,xR-w2/2,yP2-16,w2,16,C.solid,C.ink,1.5);
    // 大ピストンに載せた荷物
    rect(g,xR-60,yP2-96,120,80,C.wood,C.ink,1.5);
    text(g,fmt(r.F2/9.81)+' kg 相当',xR,yP2-56,{align:'center',size:14,weight:700});
    // 力の矢印
    arrow(g,xL,yP1-120,xL,yP1-20,C.hi,4,14);
    text(g,'F₁ = '+fmt(S.P.F1)+' N',xL+16,yP1-100,{size:15,weight:700,color:C.hi});
    const L2=clamp(40*Math.log10(r.F2/S.P.F1*10),30,150);
    arrow(g,xR+w2/2+50,yP2+L2-20,xR+w2/2+50,yP2-20,C.accent,5,16);
    text(g,'F₂ = '+fmt(r.F2)+' N',xR+w2/2+64,yP2+10,{size:15,weight:700,color:C.accent});
    // 圧力表示
    text(g,'どこでも同じ圧力 p = '+fmt(r.p/1000)+' kPa',(xL+xR)/2,base+20,{align:'center',size:14,weight:700,bg:C.paper});

    text(g,'x₂ = '+fmt(r.x2*10)+' mm（上昇）',xR-w2/2-14,top+20,{align:'right',size:13,color:C.muted});
  },
  readout(S){ const r=this.calc(S); return [
    ['面積比 $A_2/A_1$', fmt(r.ratio)],
    ['圧力 $p = F_1/A_1$', fmt(r.p/1000)+' kPa'],
    ['大ピストンの力 $F_2$', fmt(r.F2)+' N'],
    ['大ピストンの上昇 $x_2$', fmt(r.x2*10)+' mm'],
    ['仕事 $F_1 x_1$', fmt(r.W1)+' J'],

});

// 中級：ハーゲン・ポアズイユの法則
defineSim({
  id:'poiseuille', level:'intermediate', order:3, name:'ハーゲン・ポアズイユの法則（円管内の層流）',
  formula:'$$u(r) = \\frac{\\Delta p}{4\\mu L}(R^2 - r^2) \\qquad Q = \\frac{\\pi d^4 \\Delta p}{128 \\mu L} \\qquad u_{\\max} = 2\\bar{v}$$',
  explain:'**円管内の層流では、壁で速度 0、中心で最大の放物線状の速度分布になります**。圧力差が流体を押す力と、壁からの粘性のせん断力がつり合って決まる分布です。流量は直径の 4 乗に比例するので、管を少し太くするだけで流れやすさが大きく変わります。',
  hint:'直径を 2 倍にすると流量は 16 倍になります。粘性係数を 2 倍にすると流量は半分です。Re が 2300 を超えると!!層流の仮定が成り立たなくなるので注意しましょう!!。',
  related:['M3'],
  params:[
    {id:'dp',label:'圧力差 $\\Delta p$',min:1,max:100,step:0.5,value:40.7,unit:'kPa'},
    {id:'L',label:'管の長さ $L$',min:1,max:50,step:1,value:10,unit:'m'},
    {id:'d',label:'内径 $d$',min:2,max:20,step:0.5,value:10,unit:'mm'},
    {id:'mu',label:'流体',type:'select',value:'0.1,900',options:[['0.1,900','油 (μ = 0.1 Pa·s, ρ = 900)'],['1.0,1260','グリセリン (μ = 1.0 Pa·s, ρ = 1260)'],['0.001,1000','水 (μ = 0.001 Pa·s, ρ = 1000)'],['0.0035,1060','血液 (μ ≈ 0.0035 Pa·s, ρ = 1060)']]},
  ],
  calc(S){ const [mu,rho]=S.P.mu.split(',').map(Number), d=S.P.d/1000, R=d/2, dp=S.P.dp*1000, L=S.P.L;
    const Q=Math.PI*d**4*dp/(128*mu*L), A=Math.PI*R*R, vm=Q/A, umax=2*vm, Re=rho*vm*d/mu, tau=dp*R/(2*L);
    return {mu,rho,d,R,dp,L,Q,vm,umax,Re,tau}; },
  init(S){ S.parts=Array.from({length:160},()=>({x:Math.random(),r:Math.random()*2-1})); S.ref=null; },
  step(S,dt){ const r=this.calc(S), vis=this.vis(r); for(const p of S.parts){ p.x+= (1-p.r*p.r)*vis*dt; if(p.x>1){p.x-=1;p.r=Math.random()*2-1;} } },
  vis(r){ return clamp(r.umax*0.8,0.02,1.2); }, // 表示用の中心速度（画面幅/秒）
  draw(g,S){
    const C=S.C, r=this.calc(S), cy=270, Rp=clamp(20+S.P.d*9,30,200), x0=60, x1=700;
    g.save(); g.fillStyle=C.m; g.globalAlpha=.18; g.fillRect(x0,cy-Rp,x1-x0,2*Rp); g.restore();
    line(g,[[x0,cy-Rp],[x1,cy-Rp]],C.ink,3); line(g,[[x0,cy+Rp],[x1,cy+Rp]],C.ink,3);
    g.fillStyle=C.water_deep; for(const p of S.parts){ g.beginPath(); g.arc(x0+p.x*(x1-x0),cy+p.r*Rp*0.97,2.4,0,7); g.fill(); }
    // 放物線状の速度分布
    const xs=760, sc=150/Math.max(r.umax,1e-9)*clamp(r.umax/0.5,0.15,1);
    const pts=[]; for(let i=-20;i<=20;i++){ const y=i/20, u=r.umax*(1-y*y); pts.push([xs+u*sc,cy+y*Rp]); if(i%4===0) arrow(g,xs,cy+y*Rp,xs+u*sc,cy+y*Rp,C.accent,1.4,7); }
    line(g,[[xs,cy-Rp-10],[xs,cy+Rp+10]],C.muted,1); line(g,pts,C.accent,2.5);
    text(g,'u_max = '+fmt(r.umax)+' m/s',xs+6,cy-Rp-26,{size:14,weight:700,color:C.accent});
    const xm=xs+r.vm*sc; line(g,[[xm,cy-Rp],[xm,cy+Rp]],C.hi,1.5,[5,4]); text(g,'v̄',xm+6,cy+Rp+18,{size:14,weight:700,color:C.hi});
    // 圧力の向き
    text(g,'p₁',x0+10,cy-Rp-24,{size:15,weight:700}); text(g,'p₂ = p₁ − '+fmt(S.P.dp)+' kPa',x1-10,cy-Rp-24,{align:'right',size:15,weight:700});
    arrow(g,x0+60,cy-Rp-24,x1-200,cy-Rp-24,C.muted,1.5,8);
    // せん断応力
    text(g,'壁のせん断応力 τ_w = ΔpR/(2L) = '+fmt(r.tau)+' Pa',x0,cy+Rp+30,{size:14,color:C.ink});
    // 層流チェック
    const ok=r.Re<2300;
    text(g,(ok?'Re = '+fmt(r.Re)+'：層流なのでこの式が使えます':'Re = '+fmt(r.Re)+'：2300 を超えています（実際は乱流になり、この式は使えません）'),480,560,{align:'center',size:15,weight:700,color:ok?C.b:C.a});
  },
  readout(S){ const r=this.calc(S); return [
    ['流量 $Q$',fmt(r.Q*1e6)+' mL/s'],['平均流速 $\\bar{v} = Q/A$',fmt(r.vm)+' m/s'],['最大流速 $u_{\\max} = 2\\bar{v}$',fmt(r.umax)+' m/s'],
    ['レイノルズ数 $Re$',fmt(r.Re)],['壁のせん断応力 $\\tau_w$',fmt(r.tau)+' Pa'],['ポンプ動力 $\\Delta p\\, Q$',fmt(r.dp*r.Q)+' W']]; }
});
